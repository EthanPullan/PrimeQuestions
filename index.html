}

const pdfNum = n => String(Math.round(n * 100) / 100);
class Doc {
  constructor() { this.pages = []; this.newPage(); }
  newPage() { this.page = { ops: [], images: [] }; this.pages.push(this.page); this.y = PAGE_H - TOP; return this.page; }
  room() { return this.y - BOT; }
  text(x, y, str, size, bold, gray) {
    this.page.ops.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + pdfNum(size) + ' Tf ' + pdfNum(gray || 0) + ' g ' + pdfNum(x) + ' ' + pdfNum(y) + ' Td ' + pstrBytes(str) + ' Tj ET');
  }
  rect(x, y, w, h, gray) { this.page.ops.push(pdfNum(gray) + ' g ' + pdfNum(x) + ' ' + pdfNum(y) + ' ' + pdfNum(w) + ' ' + pdfNum(h) + ' re f 0 g'); }
  drawRow(r, yTop) {
    const base = yTop - r.top - r.size - (r.lh - r.size) / 2;
    if (r.label) this.text(MX + (r.xl || 0), base, r.label, r.size, true, r.gray);
    if (r.text !== '') this.text(MX + r.x, base, r.text, r.size, r.bold, r.gray);
  }
  place(block) {
    const usable = PAGE_H - TOP - BOT;
    if (block.kind === 'image') {
      let w = block.drawW, h = block.drawH;
      if (h > usable) { const f = usable / h; w *= f; h = usable; }
      if (h > this.room()) this.newPage();
      this.page.images.push(block);
      this.page.ops.push('q ' + pdfNum(w) + ' 0 0 ' + pdfNum(h) + ' ' + pdfNum(MX) + ' ' + pdfNum(this.y - h) + ' cm /Im' + (this.page.images.length - 1) + ' Do Q');
      this.y -= h + GAP;
    } else if (block.height <= usable) {
      if (block.height > this.room()) this.newPage();
      block.rows.forEach(r => this.drawRow(r, this.y));
      this.y -= block.height + GAP;
    } else {   // longer than a whole page: unavoidable split between rows
      let offset = 0;
      for (const r of block.rows) {
        if (this.y - (r.top - offset) - r.lh < BOT) { this.newPage(); offset = r.top; }
        this.drawRow({ ...r, top: r.top - offset }, this.y);
      }
      const last = block.rows[block.rows.length - 1];
      this.y -= (last.top - offset) + last.lh + GAP;
    }
  }
}
// text operand with bytes >= 128 kept as raw Latin-1 (WinAnsi) inside the content stream
const pstrBytes = s => '(' + s.replace(/[\\()]/g, '\\$&') + ')';

// Build the whole bank PDF. opts.renderBlockImage(lines, widthPt) -> {jpeg, w, h}; absent or failing => text fallback.
async function buildBankPdf(payload, opts) {
  opts = opts || {};
  const render = opts.renderBlockImage || null;
  const progress = opts.onProgress || (() => {});
  const report = { textBlocks: 0, imageBlocks: 0, fallbacks: 0, pages: 0 };
  const stim = new Map(payload.stimuli.map(s => [s.id, s]));
  const doc = new Doc();

  const makeBlock = async lines => {
    const wantsImage = lines.some(l => needsImage(l.text || '') || needsImage(l.label || ''));
    if (wantsImage && render) {
      try {
        const im = await render(lines, CW);
        report.imageBlocks++;
        return { kind: 'image', jpeg: im.jpeg, w: im.w, h: im.h, drawW: CW, drawH: CW * im.h / im.w };
      } catch (e) { report.fallbacks++; }
    }
    report.textBlocks++;
    return layoutText(lines, CW);
  };

  // one group per bank (questions whose bank is missing from the file go in "Other"); inside a bank, one section per type
  const bankOrder = (a, b) => a.name.localeCompare(b.name) || a.id.localeCompare(b.id);
  const bankList = (payload.banks || []).slice().sort(bankOrder);
  const known = new Set(bankList.map(b => b.id));
  if (payload.questions.some(q => !known.has(q.bankId))) bankList.push({ id: '\u0000other', name: 'Other' });
  const groups = [];
  for (const b of bankList) {
    const qs = payload.questions.filter(q => (b.id === '\u0000other' ? !known.has(q.bankId) : q.bankId === b.id));
    const byType = {};
    for (const t of TYPES) byType[t] = qs.filter(q => q.type === t);
    groups.push({ bank: b, count: qs.length, byType, sections: TYPES.filter(t => byType[t].length) });
  }
  const dateStr = payload.exportedAt.slice(0, 10);
  const fit = (str, bold, size, maxW) => { let t = safe(str).replace(/\n/g, ' '); while (t.length > 1 && textWidth(t, bold, size) > maxW) t = t.slice(0, -1); return t; };
  const bankTitle = groups.length === 1 ? groups[0].bank.name : 'Question Banks';

  // --- cover page ---
  const nQ = payload.questions.length;
  doc.rect(0, PAGE_H - 14, PAGE_W, 14, 0.1);
  doc.text(MX, PAGE_H - 70, 'PRIME QUESTIONS  \u00B7  QUESTION BANK FILE', 9, true, 0.3);
  doc.text(MX, PAGE_H - 110, fit(bankTitle, true, 28, CW), 28, true, 0);
  doc.text(MX, PAGE_H - 134, nQ + ' Question' + (nQ === 1 ? '' : 's'), 12, true, 0);
  const extras = [];
  if (payload.stimuli.length) extras.push(payload.stimuli.length + ' shared stimul' + (payload.stimuli.length === 1 ? 'us' : 'i'));
  if (payload.tests.length) extras.push(payload.tests.length + ' saved test' + (payload.tests.length === 1 ? '' : 's'));
  if (extras.length) doc.text(MX, PAGE_H - 150, extras.join('   '), 10, false, 0.3);
  const boxTop = PAGE_H - 175;
  const boxLines = wrapText('It holds the whole question bank, answers included. Import works only from this original file: printing it, scanning it, or saving it again as a PDF removes the data Prime Questions reads. This is a teacher copy. Keep it private, because it contains the answers.', false, 10, CW - 36);
  const boxH = 30 + boxLines.length * 13 + 12;
  doc.rect(MX, boxTop - boxH, CW, boxH, 0.93);
  doc.rect(MX, boxTop - boxH, 4, boxH, 0.1);
  doc.text(MX + 18, boxTop - 22, 'A digital file for importing into Prime Questions', 11, true, 0);
  boxLines.forEach((l, i) => doc.text(MX + 18, boxTop - 40 - i * 13, l, 10, false, 0));
  let cy = boxTop - boxH - 44;
  doc.text(MX, cy, groups.length === 1 ? 'Question Types' : 'Question Banks', 16, true, 0);
  doc.text(MX, cy - 15, groups.length === 1 ? 'Each type starts on its own page.' : 'Each bank starts on its own page, grouped by question type.', 9, false, 0.3);
  cy -= 40;
  const indexRows = groups.length === 1
    ? groups[0].sections.map(t => [TYPE_LABEL[t], groups[0].byType[t].length])
    : groups.map(g => [fit(g.bank.name, true, 12, CW - 80), g.count]);
  if (payload.stimuli.length) indexRows.push(['Shared Stimuli', payload.stimuli.length]);
  if (payload.tests.length) indexRows.push(['Saved Tests', payload.tests.length]);
  for (const [label, n] of indexRows) {
    const ns = String(n), nw = textWidth(ns, true, 12), lw = textWidth(label, true, 12);
    doc.text(MX, cy, label, 12, true, 0);
    doc.text(PAGE_W - MX - nw, cy, ns, 12, true, 0);
    const dots = Math.max(0, Math.floor((CW - lw - nw - 16) / textWidth('.', false, 9)));
    doc.text(MX + lw + 8, cy, '.'.repeat(dots), 9, false, 0.5);
    cy -= 24;
  }
  doc.text(MX, 90, 'Exported ' + dateStr + '  \u00B7  Prime Questions ' + payload.appVersion + '  \u00B7  data format ' + payload.schemaVersion, 9, false, 0.3);

  // --- sections ---
  let done = 0;
  const total = nQ + payload.stimuli.length + payload.tests.length;
  const heading = (title, n, sub) => {
    doc.newPage();
    doc.rect(MX, doc.y - 34, 5, 38, 0.1);
    doc.text(MX + 16, doc.y - 18, title, 22, true, 0);
    doc.text(MX + 16, doc.y - 32, (sub ? fit(sub, false, 9.5, CW - 140) + '  \u00B7  ' : '') + n + ' ' + (n === 1 ? 'item' : 'items'), 9.5, false, 0.3);
    doc.y -= 62;
  };
  for (const g of groups) for (const t of g.sections) {
    heading(TYPE_LABEL[t], g.byType[t].length, groups.length > 1 ? g.bank.name : '');
    const qs = g.byType[t].slice().sort((a, b) => a.created.localeCompare(b.created) || a.id.localeCompare(b.id));
    let n = 0;
    for (const q of qs) { doc.place(await makeBlock(blockLines(q, ++n, { stim }))); progress(++done, total); }
  }
  if (payload.stimuli.length) {
    heading('Shared Stimuli', payload.stimuli.length);
    for (const s of payload.stimuli) { doc.place(await makeBlock(stimulusLines(s))); progress(++done, total); }
  }
  if (payload.tests.length) {
    heading('Saved Tests', payload.tests.length);
    for (const t of payload.tests) { doc.place(await makeBlock(testLines(t))); progress(++done, total); }
  }
  report.pages = doc.pages.length;

  // --- assemble the PDF file ---
  const pdf = new Pdf();
  const catalog = pdf.reserve(), pagesId = pdf.reserve();
  const f1 = pdf.add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2 = pdf.add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids = [];
  for (let i = 0; i < doc.pages.length; i++) {
    const pg = doc.pages[i];
    const xo = pg.images.map((im, k) => '/Im' + k + ' ' + pdf.add(pdf.stream('/Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode', im.jpeg)) + ' 0 R').join(' ');
    const foot = [
      'BT /F1 8 Tf 0.3 g ' + MX + ' 34 Td (Prime Questions  \u00B7  Question Bank File) Tj ET',
      'BT /F1 8 Tf 0.3 g ' + pdfNum(PAGE_W - MX - textWidth('Page ' + (i + 1) + ' of ' + doc.pages.length, false, 8)) + ' 34 Td (Page ' + (i + 1) + ' of ' + doc.pages.length + ') Tj ET'
    ];
    const content = await deflate(latin1(pg.ops.concat(foot).join('\n')));
    const cs = pdf.add(pdf.stream('/Filter /FlateDecode', content));
    kids.push(pdf.add('<< /Type /Page /Parent ' + pagesId + ' 0 R /MediaBox [0 0 ' + PAGE_W + ' ' + PAGE_H + '] /Contents ' + cs + ' 0 R /Resources << /Font << /F1 ' + f1 + ' 0 R /F2 ' + f2 + ' 0 R >>' + (xo ? ' /XObject << ' + xo + ' >>' : '') + ' >> >>'));
  }
  pdf.set(pagesId, '<< /Type /Pages /Count ' + kids.length + ' /Kids [' + kids.map(k => k + ' 0 R').join(' ') + '] >>');
  const json = enc.encode(JSON.stringify(payload));
  const ef = pdf.add(pdf.stream('/Type /EmbeddedFile /Subtype /application#2Fjson /Params << /Size ' + json.length + ' >> /Filter /FlateDecode', await deflate(json)));
  const spec = pdf.add('<< /Type /Filespec /F ' + pstr(ATTACHMENT_NAME) + ' /UF ' + pstr(ATTACHMENT_NAME) + ' /AFRelationship /Data /EF << /F ' + ef + ' 0 R >> >>');
  const d = new Date(payload.exportedAt);
  const pad = n => String(n).padStart(2, '0');
  const pdfDate = 'D:' + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  const info = pdf.add('<< /Title ' + pstr('Prime Questions - Question Bank') + ' /Subject ' + pstr('Teacher question bank containing answers; format ' + payload.schemaVersion) + ' /Creator ' + pstr('Prime Questions') + ' /Producer ' + pstr('Prime Questions ' + payload.appVersion) + ' /CreationDate ' + pstr(pdfDate) + ' >>');
  pdf.set(catalog, '<< /Type /Catalog /Pages ' + pagesId + ' 0 R /Lang (en-US) /Names << /EmbeddedFiles << /Names [' + pstr(ATTACHMENT_NAME) + ' ' + spec + ' 0 R] >> >> /AF [' + spec + ' 0 R] >>');
  return { bytes: pdf.build(catalog, info), report };
}

/* === STORAGE (IndexedDB) === */
const db = (() => {
  let handle = null, opening = null;
  function open() {
    if (handle) return Promise.resolve(handle);
    if (opening) return opening;          // parallel callers share one connection (separate opens leaked connections)
    opening = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, DB_VERSION);
      r.onupgradeneeded = ev => {
        const d = r.result, tx = r.transaction;
        for (const s of ['questions', 'stimuli', 'tests', 'banks', 'testVersions']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
        if (!d.objectStoreNames.contains('images')) d.createObjectStore('images');   // Blobs keyed by id
        // version 2 (schema 3): every question and stimulus belongs to a bank. Existing records move to the default bank
        // inside this same upgrade transaction, so a failure leaves the old database exactly as it was.
        if (ev.oldVersion < 2) {
          tx.objectStore('banks').put(defaultBank());
          if (ev.oldVersion >= 1) for (const name of ['questions', 'stimuli']) {
            tx.objectStore(name).openCursor().onsuccess = e => {
              const c = e.target.result;
              if (!c) return;
              if (!c.value.bankId) { const v = c.value; v.bankId = DEFAULT_BANK_ID; c.update(v); }
              c.continue();
            };
          }
        }
      };
      r.onsuccess = () => {
        const conn = r.result;
        conn.onversionchange = () => { conn.close(); if (handle === conn) handle = null; };
        handle = conn; res(conn);
      };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Storage is blocked by another open copy of Prime Questions. Close the other tab and reload.'));
    });
    const clear = () => { opening = null; };
    opening.then(clear, clear);
    return opening;
  }
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const finish = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Storage write was cancelled')); });
  return {
    async getAll(store) { const d = await open(); return req(d.transaction(store).objectStore(store).getAll()); },
    async getImages() {
      const d = await open();
      const st = d.transaction('images').objectStore('images');
      const [keys, vals] = await Promise.all([req(st.getAllKeys()), req(st.getAll())]);
      return keys.map((id, i) => ({ id, blob: vals[i] }));
    },
    async getImageIds() { const d = await open(); return req(d.transaction('images').objectStore('images').getAllKeys()); },
    async getImage(id) { const d = await open(); return req(d.transaction('images').objectStore('images').get(id)); },
    async put(store, rec) { const d = await open(); const tx = d.transaction(store, 'readwrite'); tx.objectStore(store).put(rec); return finish(tx); },
    async del(store, id) { const d = await open(); const tx = d.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); return finish(tx); },
    // One transaction, so an import, a save with images, or a delete that also edits other records is all-or-nothing.
    // b = { banks, questions, stimuli, tests, testVersions: [records to put], images: [{id, blob}],
    //       deletes: { banks, questions, stimuli, tests, testVersions: [ids] } }
    async applyBatch(b) {
      const d = await open();
      const tx = d.transaction(['banks', 'questions', 'stimuli', 'tests', 'testVersions', 'images'], 'readwrite');
      for (const c of ['banks', 'questions', 'stimuli', 'tests', 'testVersions']) {
        for (const r of (b[c] || [])) tx.objectStore(c).put(r);
        for (const id of ((b.deletes && b.deletes[c]) || [])) tx.objectStore(c).delete(id);
      }
      for (const im of (b.images || [])) tx.objectStore('images').put(im.blob, im.id);
      return finish(tx);
    }
  };
})();

/* === UI helpers === */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid instanceof Node ? kid : String(kid)); }
  return el;
}

// Math rendering: text is already in place (set with textContent); Temml renders inside it.
function renderMath(el) {
  temml.renderMathInElement(el, {
    delimiters: [{ left: '\\(', right: '\\)', display: false }],
    preProcess: s => '\\displaystyle ' + s,
    errorCallback: () => {}
  });
}

function toast(msg, kind) {
  const t = h('div', { class: 'toast ' + (kind || '') }, msg);
  document.getElementById('toasts').append(t);
  setTimeout(() => t.remove(), kind === 'err' ? 7000 : 3600);
}

// Promise-based dialog. actions: [{label, value, kind}]; Escape resolves dismissValue.
function modal({ title, body, actions, dismissValue }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const close = v => { back.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus) prev.focus(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape' && dismissValue !== undefined) { e.stopPropagation(); close(dismissValue); } };
    const btns = actions.map(a => h('button', { class: 'btn ' + (a.kind || ''), type: 'button', onclick: () => close(a.value) }, a.label));
    const back = h('div', { class: 'modal-back' },
      h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
        h('h3', null, title), body, h('div', { class: 'actions' }, btns)));
    document.body.append(back);
    document.addEventListener('keydown', onKey, true);
    // never start focus on a destructive button: Enter must not confirm a delete
    const safeIdx = actions.some(a => a.kind === 'danger') ? 0 : btns.length - 1;
    (btns[safeIdx] || back).focus();
  });
}
const info = (title, ...paras) => modal({ title, body: h('div', null, paras.flat().map(p => h('p', null, p))), actions: [{ label: 'OK', value: true, kind: 'primary' }], dismissValue: true });

function progressModal(title) {
  const bar = h('div', null), label = h('p', { class: 'hint' }, 'Starting…');
  const back = h('div', { class: 'modal-back' }, h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('h3', null, title), label, h('div', { class: 'progress-bar' }, bar)));
  document.body.append(back);
  return { update(done, total, text) { bar.style.width = (total ? Math.round(done * 100 / total) : 100) + '%'; label.textContent = text || (done + ' of ' + total); }, close() { back.remove(); } };
}

/* === BLOCK RENDERING (screen preview + image route of the PDF) === */
function blockCss(u, sel) {
  const p = n => (n * u).toFixed(2) + 'px';
  return sel + '{font-family:Helvetica,Arial,"Liberation Sans",sans-serif;color:#000;font-size:' + p(11) + ';line-height:' + p(15) + ';}' +
    sel + ' .pb-row{margin:0 0 ' + p(4) + ';white-space:pre-wrap;overflow-wrap:anywhere;}' +
    sel + ' .pb-title{font-weight:700;font-size:' + p(13) + ';line-height:' + p(16) + ';margin-top:' + p(6) + ';}' +
    sel + ' .pb-title:first-child{margin-top:0;}' +
    sel + ' .pb-meta,' + sel + ' .pb-sub{font-size:' + p(9.5) + ';line-height:' + p(12.5) + ';color:#444;}' +
    sel + ' .pb-hang{display:flex;}' +
    sel + ' .pb-label{flex:none;font-weight:700;padding-right:' + p(4) + ';}' +
    sel + ' .pb-option .pb-label{min-width:' + p(24) + ';}' +
    sel + ' .pb-text{flex:1;min-width:0;}' +
    sel + ' .pb-ind{margin-left:' + p(18) + ';}' +
    sel + ' .pb-stim{border-left:' + p(2) + ' solid #000;padding-left:' + p(8) + ';}' +
    sel + ' .pq-table{border-collapse:collapse;margin:' + p(2) + ' 0;}' +
    sel + ' .pq-table th,' + sel + ' .pq-table td{border:1px solid #000;padding:' + p(2) + ' ' + p(6) + ';text-align:left;}' +
    sel + ' .pq-cap{font-weight:700;padding-bottom:' + p(2) + ';}' +
    sel + ' .pq-imgs img{max-width:100%;max-height:' + p(180) + ';margin:' + p(2) + ' ' + p(6) + ' 0 0;}';
}
function buildBlockDom(lines) {
  const root = h('div', { class: 'pb' });
  for (const l of lines) {
    if (l.k === 'table') { root.append(h('div', { class: 'pb-row pb-tablerow' }, buildTableDom(l.table))); continue; }
    if (l.k === 'imgs') { root.append(h('div', { class: 'pb-row pb-imgsrow' }, buildImgsDom(l.ids))); continue; }
    const row = h('div', { class: 'pb-row pb-' + l.k + (l.label ? ' pb-hang' : '') + (l.ind ? ' pb-ind' : '') });
    if (l.label) row.append(h('span', { class: 'pb-label' }, l.label));
    row.append(h('span', { class: 'pb-text' }, l.text || ''));
    root.append(row);
  }
  return root;
}
function temmlCss() {
  const css = document.getElementById('app-css').textContent;
  const a = css.indexOf('/* === VENDOR START: temml CSS'), b = css.indexOf('/* === VENDOR END: temml CSS === */');
  if (a < 0 || b < 0) throw new Error('Temml CSS block not found');
  return css.slice(a, b);
}

// Image route: lines -> DOM (+ Temml) -> SVG foreignObject -> canvas -> JPEG. Throws if the browser cannot do it.
async function renderBlockImage(lines, widthPt) {
  const SCALE = 3;
  const W = Math.round(widthPt * SCALE);
  const styleEl = h('style', null, blockCss(SCALE, '.pbimg .pb'));
  // host is parked off-screen; only `inner` is serialized, so the off-screen position is not drawn
  const inner = h('div', { class: 'pbimg', style: 'width:' + W + 'px;background:#fff;' }, buildBlockDom(lines));
  const wrap = h('div', { style: 'position:fixed;left:-100000px;top:0;' }, inner);
  document.head.append(styleEl);
  document.body.append(wrap);
  try {
    renderMath(inner);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const H = Math.ceil(inner.getBoundingClientRect().height) + 4;
    const xml = new XMLSerializer().serializeToString(inner);
    // CSS goes in CDATA: raw "&" and "<" in it make the SVG fail to load
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '"><style>/*<![CDATA[*/' + temmlCss() + blockCss(SCALE, '.pbimg .pb') + '/*]]>*/</style><foreignObject x="0" y="0" width="' + W + '" height="' + H + '">' + xml + '</foreignObject></svg>';
    const img = new Image();

const MAX_IMAGE_EDGE = 1600, MAX_IMAGE_BYTES = 25 * 1024 * 1024, MAX_SVG_BYTES = 2 * 1024 * 1024;
const MAX_IMAGES = 6, MAX_COLS = 8, MAX_ROWS = 40;
const imgUrls = new Map();     // image id -> object URL, for this page load

// Make sure the object URLs for these ids exist. `pending` holds images added in the open editor and not saved yet.
async function ensureImageUrls(ids, pending) {
  for (const id of ids) {
    if (imgUrls.has(id)) continue;
    let blob = pending && pending.get(id);
    if (!blob) { try { blob = await db.getImage(id); } catch (e) { blob = null; } }
    if (blob) imgUrls.set(id, URL.createObjectURL(blob));
  }
}

// PNG and JPEG are kept as they are unless the long edge is over ~1600 px (then re-drawn smaller). SVG is kept as is
// and is only ever shown through <img>, so any script inside it never runs.
async function processImageFile(file) {
  if (file.size > MAX_IMAGE_BYTES) throw new Error('That file is bigger than 25 MB.');
  const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
  const png = head[0] === 0x89 && head[1] === 0x50 && head[2] === 0x4E && head[3] === 0x47;
  const jpg = head[0] === 0xFF && head[1] === 0xD8 && head[2] === 0xFF;
  if (!png && !jpg) {
    if (file.size > MAX_SVG_BYTES) throw new Error('Use a PNG, JPEG or SVG image (an SVG can be up to 2 MB).');
    const text = await file.text();
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    if (doc.getElementsByTagName('parsererror').length || doc.documentElement.nodeName !== 'svg') throw new Error('Use a PNG, JPEG or SVG image.');
    return new Blob([text], { type: 'image/svg+xml' });
  }
  let bmp;
  try { bmp = await createImageBitmap(file); } catch (e) { throw new Error('That image could not be read.'); }
  const type = png ? 'image/png' : 'image/jpeg';
  const long = Math.max(bmp.width, bmp.height);
  if (long <= MAX_IMAGE_EDGE) { if (bmp.close) bmp.close(); return new Blob([file], { type }); }
  const f = MAX_IMAGE_EDGE / long;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  const blob = await new Promise(res => c.toBlob(res, type, 0.9));
  if (!blob) throw new Error('That image could not be resized.');
  return blob;
}

// A small popover menu under `anchor`. items: [{label, onclick, checked, disabled, hr, id}]. Closes on outside click or Escape.
let openMenuEl = null, menuOff = null;
function closeMenu() {
  if (menuOff) { document.removeEventListener('mousedown', menuOff, true); menuOff = null; }
  if (openMenuEl) { openMenuEl.remove(); openMenuEl = null; }
}
function openMenu(anchor, items, opts) {
  closeMenu();
  const rect = anchor.getBoundingClientRect();
  const menu = h('div', { class: 'menu', role: 'menu', style: 'left:' + Math.max(8, Math.min(rect.left, window.innerWidth - 250)) + 'px;top:' + (rect.bottom + 4) + 'px;' + (opts && opts.right ? 'left:auto;right:' + Math.max(8, window.innerWidth - rect.right) + 'px;' : '') },
    items.map(it => it.hr ? h('div', { class: 'menu-hr' }) : h('button', { type: 'button', role: 'menuitem', class: 'menu-item', id: it.id, disabled: !!it.disabled,
      onclick: () => { closeMenu(); if (it.onclick) it.onclick(); } }, h('span', { class: 'menu-check' }, it.checked ? '✓' : ''), it.label)));
  document.body.append(menu);
  openMenuEl = menu;
  const first = menu.querySelector('.menu-item:not([disabled])'); if (first) first.focus();
  const off = e => { if (!menu.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) closeMenu(); };
  menuOff = off;                 // removed again by closeMenu, so an old menu's listener can never close a newer menu
  document.addEventListener('mousedown', off, true);
  menu.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeMenu(); anchor.focus(); }
    const its = Array.from(menu.querySelectorAll('.menu-item:not([disabled])')), k = its.indexOf(document.activeElement);
    if (e.key === 'ArrowDown') { e.preventDefault(); its[(k + 1) % its.length].focus(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); its[(k - 1 + its.length) % its.length].focus(); }
  });
}

  try { await db.applyBatch({ banks: [Object.assign({}, b, { name: name.slice(0, 200), updated: nowIso() })] }); } catch (e) { toast('Could not rename: ' + (e && e.message || e), 'err'); return; }

async function deleteBank(b) {
  const qs = state.questions.filter(q => q.bankId === b.id), ss = state.stimuli.filter(s => s.bankId === b.id);

  const ok = await modal({
    title: 'Delete this question bank?',
    body: h('div', null, h('p', null, h('b', null, b.name)),
      h('p', null, 'This permanently removes ' + plural(qs.length, 'question') + (ss.length ? ' and ' + plural(ss.length, 'stimulus', 'stimuli') : '') + ' from this browser.' + (tests.length ? ' They will also be taken out of ' + plural(tests.length, 'saved test') + ' (' + tests.map(t => t.title || 'Untitled').join(', ') + ').' : '')),
      h('p', { class: 'hint' }, 'If you have not exported a recent backup, it cannot be recovered.')),
    actions: [{ label: 'Cancel', value: false }, { label: 'Delete bank and its questions', value: true, kind: 'danger' }], dismissValue: false
  });
  if (!ok) return;
  const t = nowIso();
  try {
    await db.applyBatch({ deletes: { banks: [b.id], questions: qs.map(q => q.id), stimuli: ss.map(s => s.id) },

function insideMath(v, pos) { const before = v.slice(0, pos); return before.lastIndexOf('\\(') > before.lastIndexOf('\\)'); }

function insertSnippet(f, btn) {
  if (!f || !f.isConnected) { toast('Click into a text box first, then use the insert buttons.', 'warn'); return; }
  const v = f.value, s = f.selectionStart, e = f.selectionEnd, sel = v.slice(s, e);
  const inside = insideMath(v, s);

/* === PRINT: the test paper and the answer key (same DOM for preview and print) === */
const planImageIds = plan => plan.blocks.flatMap(b => (b.stimulus ? b.stimulus.imageIds : []).concat(...b.items.map(i => i.q.imageIds)));

// What a student writes on, for one question or one part of a multipart question (v = a questionView)
function answerAreaDom(v) {
  if (v.type === 'mc') return h('div', { class: 'tp-opts' }, v.options.map((o, i) => h('div', { class: 'tp-opt' }, h('span', { class: 'tp-let' }, letter(i) + '.'), h('span', { class: 'tp-text' }, o.text))));

  return h('div', { class: 'tp-match' },
    h('div', { class: 'tp-mcol' }, v.left.map((l, i) => h('div', { class: 'tp-mrow l' }, h('span', { class: 'tp-mblank' }), h('span', { class: 'tp-let' }, (i + 1) + '.'), h('span', { class: 'tp-text' }, l)))),
    h('div', { class: 'tp-mcol' }, v.right.map((r, i) => h('div', { class: 'tp-mrow r' }, h('span', { class: 'tp-let' }, letter(i) + '.'), h('span', { class: 'tp-text' }, r)))));

function buildQuestionDom(it) {
  const q = it.q, v = it.view;

  if (q.type !== 'multipart' || q.prompt.trim()) body.append(h('div', { class: 'tp-text tp-prompt' }, q.prompt));

    h('div', { class: 'tp-pbody' }, p.prompt ? h('div', { class: 'tp-text' }, p.prompt) : null, answerAreaDom(p)))));
  else body.append(answerAreaDom(v));
  return h('div', { class: 'tp-q', 'data-n': String(it.number), 'data-qid': q.id }, h('span', { class: 'tp-num' }, it.number + '.'), body);

function stimulusDom(b) {
  const st = h('div', { class: 'tp-stim' });
  if (b.stimulus.title) st.append(h('div', { class: 'tp-stim-title' }, b.stimulus.title));

// ed (optional) makes the paper editable on screen: { setTitle, setCourse, setInstructions, toggleLine(k), addInstructions(),
// tools(kind, blockIndex, item) -> node }. Printing never passes it, so the printed paper has none of those controls.
function buildSheet(plan, kind, ed) {
  const root = h('div', { class: 'sheet' + (ed ? ' editing' : '') + ' paper-' + (PAPERS[plan.paper] ? plan.paper : 'letter') });
  const head = h('div', { class: 'tp-head' }, h('div', { class: 'tp-version' }, kind === 'key' ? 'Answer Key · Version ' + plan.version : 'Version ' + plan.version));
  if (ed) head.append(
    h('input', { type: 'text', class: 'tp-edit tp-title', id: 'f-test-title', value: plan.title, placeholder: 'Untitled Test', 'aria-label': 'Test title', oninput: e => ed.setTitle(e.target.value) }),
    h('input', { type: 'text', class: 'tp-edit tp-subin', id: 'f-test-course', value: plan.course, placeholder: 'Course (optional)', 'aria-label': 'Course', oninput: e => ed.setCourse(e.target.value) }));
  else { head.append(h('h1', null, plan.title || 'Untitled test')); if (plan.course) head.append(h('div', { class: 'tp-sub' }, plan.course)); }
  if (kind === 'test') {
    if (ed) {
      if (ed.hasInstructions()) head.append(h('textarea', { class: 'tp-edit tp-instr', id: 'f-test-instructions', rows: '2', maxlength: '5000', placeholder: 'Instructions for students (optional)', 'aria-label': 'Instructions', oninput: e => { ed.setInstructions(e.target.value); e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; } }, plan.instructions));
      else head.append(h('button', { type: 'button', class: 'ed-only tp-addinstr', id: 'btn-add-instructions', onclick: () => ed.addInstructions() }, '+ Add instructions'));
    } else if (plan.instructions.trim()) head.append(h('div', { class: 'tp-instr' }, plan.instructions));
    const lines = [['name', 'Name:', 'tp-long'], ['class', 'Class:', 'tp-mid'], ['date', 'Date:', 'tp-mid']].filter(([k]) => ed || plan.header[k]);
    if (lines.length) head.append(h('div', { class: 'tp-lines' }, lines.map(([k, label, cls]) => ed
      ? h('button', { type: 'button', class: 'tp-line ' + cls + (plan.header[k] ? '' : ' off'), 'data-line': k, 'aria-pressed': String(!!plan.header[k]), title: plan.header[k] ? 'Click to remove this line' : 'Click to print this line', onclick: () => ed.toggleLine(k) }, label)
      : h('div', { class: 'tp-line ' + cls, 'data-line': k }, label))));
  }
  root.append(head);
  if (kind === 'test') {
    plan.blocks.forEach((b, bi) => {
      const wrap = h('section', { class: 'tp-block', 'data-bi': String(bi), 'data-stim': b.stimulus ? b.stimulus.id : null });
      if (b.stimulus) {
        const nums = b.items.map(i => i.number);
        wrap.append(h('div', { class: 'tp-intro' }, 'Use the information below to answer ' + (nums.length > 1 ? 'questions ' + nums[0] + ' to ' + nums[nums.length - 1] : 'question ' + nums[0]) + '.'));
        const st = stimulusDom(b);
        if (ed) st.append(ed.tools('block', bi, null));
        wrap.append(st);
      }
      for (const it of b.items) {
        const qd = buildQuestionDom(it);
        if (ed) qd.append(ed.tools('question', bi, it));
        wrap.append(qd);
      }
      root.append(wrap);
    });
  } else {
    const B = plan.version === 'B';
    root.append(h('table', { class: 'tp-key' },
      h('thead', null, h('tr', null, h('th', null, B ? 'B' : 'No.'), B ? h('th', null, 'is A') : null, h('th', null, B ? 'Answer (as printed on Version B)' : 'Answer'))),
      h('tbody', null, keyEntries(plan).map(e => h('tr', null, h('td', null, String(e.number)), B ? h('td', null, 'A' + e.aNumber) : null, h('td', { class: 'tp-text' }, e.text))))));
  }
  return root;
}

// Put the sheet in the print-only area and set the page size. window.print() is the caller's job (tests skip it).
async function preparePrint(kind, version, test) {
  const plan = planTest(test, state.questions, state.stimuli, version);
  await ensureImageUrls(planImageIds(plan), null);
  plan.paper = effectivePaper(test);
  const sheet = buildSheet(plan, kind);
  el.printRoot.textContent = '';
  el.printRoot.append(sheet);
  renderMath(sheet);
  el.pageStyle.textContent = '@page{size:' + PAPERS[effectivePaper(test)].css + ' portrait;margin:16mm 14mm 18mm;}';
  await Promise.all(Array.from(sheet.querySelectorAll('img')).map(i => (i.decode ? i.decode().catch(() => {}) : Promise.resolve())));
  return plan;
}
async function printTest(kind, version, test) {
  const plan = await preparePrint(kind, version, test);
  if (!plan.total) { toast('Add questions first.', 'warn'); return; }
  const prev = document.title;
  document.title = (test.title || 'Test') + ' - ' + (kind === 'key' ? 'Answer key ' : 'Version ') + version;
  const restore = () => { document.title = prev; };
  window.addEventListener('afterprint', restore, { once: true });
  window.print();
  restore();
}

/* === TEST EDITOR: the paper on the left, your question banks on the right === */
const HISTORY_MAX = 50;      // saved versions kept per test
const PICK_MAX = 200;        // cards shown at once in the bank panel
function newTestDraft() { const t = nowIso(); return { id: uuid(), title: '', course: '', questionIds: [], seed: newSeed(), created: t, updated: t }; }

// "Does this question have problems?" is slow (it renders every maths snippet), so remember it per saved version of a question.
const problemCache = new Map();
function hasProblems(q) {
  const k = q.id + '|' + q.updated;
  let v = problemCache.get(k);
  if (v === undefined) { v = checkQuestion(q).length > 0; problemCache.set(k, v); }
  return v;
}

// Things worth a look before printing. Returns [{ text, fix? }].
function checkTest(d) {
  const qById = new Map(state.questions.map(q => [q.id, q]));
  const present = d.questionIds.map(id => qById.get(id)).filter(Boolean);
  const missing = d.questionIds.length - present.length;
  const review = present.filter(q => q.status === 'review').length;
  const bad = present.filter(hasProblems).length;
  const hinty = present.filter(q => q.type === 'mc' && !q.keepOrder && q.answer.options.some(o => /\b(all|none)\s+of\s+the\s+above\b/i.test(o)));
  const items = [];
  if (!d.questionIds.length) items.push({ text: 'There are no questions on the paper yet.' });
  if (missing) items.push({ text: plural(missing, 'question') + ' in this test ' + (missing === 1 ? 'is' : 'are') + ' no longer in any bank and will be skipped.', fix: 'missing' });
  if (review) items.push({ text: plural(review, 'question') + ' ' + (review === 1 ? 'is' : 'are') + ' marked “Needs review”.' });
  if (bad) items.push({ text: plural(bad, 'question') + ' ' + (bad === 1 ? 'has' : 'have') + ' problems (missing answers or broken maths). Open them from the paper to fix them.' });
  for (const q of hinty) items.push({ text: 'Version B will shuffle the options of “' + snippet(q.prompt).slice(0, 50) + '”, which has an “all/none of the above” option. Edit it and tick “Keep these options in this order”.' });
  return items;
}

function createExam(opts) {
  const d = opts.draft;
  let original = clone(d), isNew = !!opts.isNew, dirty = false;
  const undo = [], redo = [];
  let lastKey = null, lastAt = 0, paintSeq = 0, checkTimer = null, paintIds = [];
  const ui = { pv: 'A', panel: 'bank', bankTabs: [], bankId: null, search: '', type: '', sort: 'newest', drag: null };
  const R = {};
  const node = h('div', { class: 'exam', 'data-kind': 'test' });
  const api = {
    kind: 'test', node, isDirty: () => dirty, getDraft: () => d, save: () => save(),
    destroy() { clearTimeout(checkTimer); paintSeq++; document.removeEventListener('keydown', onKey); closeMenu(); }
  };
  const hdr = () => Object.assign({}, HEADER_DEFAULT, d.header || {});
  const qById = id => state.questions.find(q => q.id === id);
  const snap = () => JSON.stringify(d);
  const replaceDraft = s => { for (const k of Object.keys(d)) delete d[k]; Object.assign(d, JSON.parse(s)); };

  /* ---- editing with undo and redo ---- */
  // fn changes the draft. key (optional) merges quick successive edits of the same thing (typing) into one undo step.
  function mutate(fn, o) {
    o = o || {};
    const before = snap();
    fn();
    if (before === snap()) return false;
    const now = Date.now();
    if (!(o.key && o.key === lastKey && now - lastAt < 1200)) { undo.push(before); if (undo.length > 300) undo.shift(); }
    lastKey = o.key || null; lastAt = now; redo.length = 0;
    changed(!o.key);
    return true;
  }
  function stepHistory(from, to) {
    if (!from.length) return;
    to.push(snap());
    replaceDraft(from.pop());
    lastKey = null;
    changed(true);
  }
  const doUndo = () => stepHistory(undo, redo), doRedo = () => stepHistory(redo, undo);

  function changed(repaint) {
    dirty = stable(d) !== stable(original);
    R.dirtyFlag.textContent = dirty ? '● Unsaved changes' : '';
    R.saveBtn.disabled = !dirty;
    R.undoBtn.disabled = !undo.length; R.redoBtn.disabled = !redo.length;
    R.name.textContent = d.title.trim() || 'Untitled Test';
    clearTimeout(checkTimer); checkTimer = setTimeout(paintCheck, 150);
    if (repaint) { paintPaper(); if (ui.panel === 'bank' && R.paintCards) R.paintCards(); else if (ui.panel === 'history') paintHistory(); }
    const noq = !d.questionIds.length;
    for (const b of R.printItems) b.disabled = noq;
  }
  function paintCheck() {
    const n = checkTest(d).length;
    R.checkBtn.classList.toggle('warn', n > 0);
    R.checkBadge.textContent = n ? String(n) : '✓';
  }

  /* ---- the questions on the paper ---- */
  const groups = () => { const p = planTest(d, state.questions, state.stimuli, 'A'); return { plan: p, ids: p.blocks.map(b => b.items.map(i => i.q.id)) }; };
  function addQuestion(id, at) {
    if (d.questionIds.includes(id)) { toast('That question is already in this test.', 'warn'); return false; }
    const q = qById(id); if (!q) return false;
    const { plan, ids } = groups();
    const join = q.stimulusId ? plan.blocks.findIndex(b => b.stimulus && b.stimulus.id === q.stimulusId) : -1;
    if (join >= 0) { ids[join].push(id); toast('Added with the other questions that share its stimulus.', 'ok'); }
    else ids.splice(at == null ? ids.length : Math.max(0, Math.min(at, ids.length)), 0, [id]);
    mutate(() => { d.questionIds = ids.flat().concat(plan.missing); });
    return true;
  }
  function moveBlock(from, to) {
    const { plan, ids } = groups();
    if (from < 0 || from >= ids.length) return;
    const [b] = ids.splice(from, 1);
    if (to > from) to--;
    ids.splice(Math.max(0, Math.min(to, ids.length)), 0, b);
    mutate(() => { d.questionIds = ids.flat().concat(plan.missing); });
  }
  function moveInBlock(bi, qi, dir) {
    const { plan, ids } = groups();
    const g = ids[bi], j = qi + dir;
    if (!g || j < 0 || j >= g.length) return;
    const t = g[qi]; g[qi] = g[j]; g[j] = t;
    mutate(() => { d.questionIds = ids.flat().concat(plan.missing); });
  }
  const removeQuestion = id => mutate(() => { d.questionIds = d.questionIds.filter(x => x !== id); });

  /* ---- the paper ---- */
  const edApi = {
    setTitle: v => mutate(() => { d.title = v; }, { key: 'title' }),
    setCourse: v => mutate(() => { d.course = v; }, { key: 'course' }),
    setInstructions: v => mutate(() => { d.instructions = v; }, { key: 'instructions' }),
    hasInstructions: () => typeof d.instructions === 'string',
    addInstructions: () => { mutate(() => { d.instructions = ''; }); const f = document.getElementById('f-test-instructions'); if (f) f.focus(); },
    toggleLine: k => mutate(() => { const x = hdr(); x[k] = !x[k]; d.header = x; }),
    tools(kind, bi, it) {
      const ids = paintIds, n = ids.length;
      const inGroup = kind === 'question' && ids[bi].length > 1;
      const qi = it ? ids[bi].indexOf(it.q.id) : 0;
      const handle = h('span', { class: 'ed-handle', draggable: 'true', title: 'Drag to move', 'aria-hidden': 'true',
        ondragstart: e => {
          ui.drag = { kind: 'block', bi };
          e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'block ' + bi);
          const blk = e.currentTarget.closest('.tp-block'); if (blk && e.dataTransfer.setDragImage) e.dataTransfer.setDragImage(blk, 12, 12);
          blk.classList.add('dragging');
        },
        ondragend: () => endDrag() }, '⠿');
      const label = it ? 'question ' + it.number : 'the stimulus group';
      const btn = (cls, text, title, fn, disabled) => h('button', { type: 'button', class: 'xbtn ' + cls, title, 'aria-label': title, disabled: !!disabled, onclick: fn }, text);
      const kids = [handle];
      if (inGroup) kids.push(btn('t-up', '▲', 'Move ' + label + ' up', () => moveInBlock(bi, qi, -1), qi === 0), btn('t-down', '▼', 'Move ' + label + ' down', () => moveInBlock(bi, qi, 1), qi === ids[bi].length - 1));

/* === UI: export / import === */
// opts.bankId: only that bank (its questions, stimuli and the images they use; no tests). Otherwise everything.
async function collectPayload(opts) {
  const [banks, questions, stimuli, tests, imgs] = await Promise.all([db.getAll('banks'), db.getAll('questions'), db.getAll('stimuli'), db.getAll('tests'), db.getImages()]);
  let wanted = null;
  if (opts && opts.bankId) {
    wanted = new Set();
    for (const r of questions.concat(stimuli)) if (r.bankId === opts.bankId) for (const id of r.imageIds) wanted.add(id);
  }
  const images = Object.create(null);
  for (const im of imgs.sort((a, b) => String(a.id).localeCompare(String(b.id)))) if (!wanted || wanted.has(im.id)) images[im.id] = await blobToDataUrl(im.blob);
  return buildPayload({ banks, questions, stimuli, tests, images }, opts);
}

function downloadBytes(bytes, name) {
  const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
  const a = h('a', { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const localDate = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fileSlug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40);

let exporting = false;
async function exportBank(opts) {
  if (exporting) return;
  exporting = true;
  const pm = progressModal('Building your bank PDF');
  try {
    pm.update(0, 0, 'Collecting questions…');
    const payload = await collectPayload(opts);
    const { bytes, report } = await buildBankPdf(payload, { renderBlockImage, onProgress: (d, t) => pm.update(d, t, 'Drawing page content: ' + d + ' of ' + t) });
    // self-check: read the file back before offering it. A backup that cannot be read back is worse than none.
    pm.update(1, 1, 'Checking the file…');
    const back = await readPdfPayload(bytes);
    if (stable(back) !== stable(payload)) throw new Error('The finished PDF did not match your data, so it was not saved.');
    const one = opts && opts.bankId ? payload.banks[0] : null;
    downloadBytes(bytes, 'prime-questions-' + (one ? (fileSlug(one.name) || 'bank') + '-' : '') + localDate() + '.pdf');
    if (!one) ls.set('lastBackup', nowIso());          // only a full export counts as "your last backup"
    renderStatus();
    pm.close();
    toast('Exported ' + (one ? '“' + one.name + '”: ' : '') + plural(payload.questions.length, 'question') + ' to a ' + report.pages + '-page PDF. Keep this file somewhere safe.' +
      (report.fallbacks ? ' ' + report.fallbacks + ' maths question' + (report.fallbacks === 1 ? ' is' : 's are') + ' shown as plain text on the pages (all data is intact).' : ''), 'ok');
  } catch (e) {
    pm.close();
    toast('Export failed: ' + (e && e.message || e), 'err');
  } finally { exporting = false; }
}

const labelRecord = (c, r) => c === 'questions' ? snippet(r.prompt) : c === 'banks' ? r.name : (r.title || 'Untitled');

function summaryBody(plan, payload) {
  const rows = [['Question banks', 'banks'], ['Questions', 'questions'], ['Shared stimuli', 'stimuli'], ['Saved tests', 'tests']];
  const tbody = rows.map(([lab, c]) => {
    const r = plan.collections[c];
    return h('tr', null, h('td', null, lab), h('td', null, String(r.new.length)), h('td', null, String(r.changed.filter(x => x.winner === 'incoming').length)),
      h('td', null, String(r.changed.filter(x => x.winner === 'local').length)), h('td', null, String(r.unchanged.length)));
  });
  tbody.push(h('tr', null, h('td', null, 'Images'), h('td', null, String(plan.images.new.length)), h('td', null, '0'), h('td', null, '0'), h('td', null, String(plan.images.existing))));
  const body = h('div', null,
    h('p', null, 'This file was exported ' + String(payload.exportedAt).slice(0, 10) + ' by Prime Questions ' + payload.appVersion + '. Nothing is changed until you choose Apply.'),
    h('table', { class: 'sumtbl', id: 'import-summary' }, h('thead', null, h('tr', null, h('th', null, ''), h('th', null, 'New'), h('th', null, 'Updated'), h('th', null, 'Kept yours'), h('th', null, 'Same'))), h('tbody', null, tbody)));

  if (over.length) body.append(h('p', null, h('b', null, 'These will be replaced by the version in the file (it is newer):')),
    h('ul', { class: 'changes' }, over.slice(0, 8).map(({ c, x }) => h('li', null, labelRecord(c, x.local))), over.length > 8 ? h('li', null, '…and ' + (over.length - 8) + ' more') : null));
  if (kept.length) body.append(h('p', null, h('b', null, 'These differ, but your copy is kept (' + 'it is newer or the same age):')),
    h('ul', { class: 'changes' }, kept.slice(0, 8).map(({ c, x }) => h('li', null, labelRecord(c, x.local))), kept.length > 8 ? h('li', null, '…and ' + (kept.length - 8) + ' more') : null));
  return { body, overwrites: over.length };
}

async function importFile(file) {
  let raw;
  try { raw = await readPdfPayload(await file.arrayBuffer()); }
  catch (e) { await info('Could not import this file', String(e && e.message || e), 'Nothing was changed.'); return; }
  const parsed = parsePayload(raw);
  if (!parsed.ok) { await modal({ title: 'Could not import this file', body: h('div', null, parsed.errors.map(m => h('p', null, m))), actions: [{ label: 'OK', value: true, kind: 'primary' }], dismissValue: true }); return; }
  if (!(await guardDirty())) return;
  try { await loadAll(); } catch (e) { toast('Could not read your current bank: ' + (e && e.message || e), 'err'); return; }
  const payload = parsed.payload;
  const plan = planMerge({ banks: state.banks, questions: state.questions, stimuli: state.stimuli, tests: state.tests, imageIds: state.imageIds }, payload);
  if (planIsNoop(plan)) { await info('Nothing to import', 'Everything in this file is already in your bank, or your copies are newer. Nothing was changed.'); return; }
  const { body, overwrites } = summaryBody(plan, payload);
  for (;;) {
    const choice = await modal({
      title: 'Import this bank?', body,
      actions: [{ label: 'Cancel', value: 'cancel' }].concat(state.questions.length || state.stimuli.length || state.tests.length ? [{ label: 'Export my current bank first', value: 'export' }] : [])
        .concat([{ label: overwrites ? 'Apply (replaces ' + overwrites + ')' : 'Apply', value: 'apply', kind: overwrites ? 'danger' : 'primary' }]),
      dismissValue: 'cancel'
    });
    if (choice === 'export') { await exportBank(); continue; }
    if (choice !== 'apply') return;
    break;
  }
  const w = recordsToWrite(plan);
  try {
    const images = plan.images.new.map(id => ({ id, blob: dataUrlToBlob(payload.images[id]) }));   // convert first, so a bad image stops everything before any write
    await ensurePersist();
    await db.applyBatch({ banks: w.banks, questions: w.questions, stimuli: w.stimuli, tests: w.tests, images });
  } catch (e) { toast('Import failed and nothing was changed: ' + (e && e.message || e), 'err'); return; }
  await loadAll();
  const done = [w.banks.length ? plural(w.banks.length, 'bank') : null, plural(w.questions.length, 'question'), w.stimuli.length ? plural(w.stimuli.length, 'stimulus', 'stimuli') : null,
    w.tests.length ? plural(w.tests.length, 'test') : null, plan.images.new.length ? plural(plan.images.new.length, 'image') : null].filter(Boolean).join(', ');
  logImport({ name: file.name, at: nowIso(), summary: done + ' added or updated' });
  teardown();                    // whatever is on screen is redrawn from the stored data (nothing unsaved is left: guardDirty asked)
  render();
  toast('Imported: ' + done + ' added or updated.', 'ok');
}
