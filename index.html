<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prime Questions</title>
<style id="app-css">
  /* === TOKENS (STYLE_GUIDE §2, verbatim) === */
  :root{
    /* Surfaces */
    --app-bg:#e9edf0;      /* page background (cool light grey-blue) */
    --panel:#ffffff;       /* cards, toolbars, primary surfaces */
    --panel-2:#f4f6f8;     /* inputs, secondary fills, hover */
    --room-bg:#f7f8f6;     /* large canvas / work surface */

    /* Text */
    --ink:#16241f;         /* primary text (near-black green) */
    --muted:#67756f;       /* secondary text, labels, hints */

    /* Lines */
    --line:#d8dee2;        /* borders, dividers */
    --grid-line:rgba(31,61,53,.07); /* faint canvas grid */

    /* Brand / primary (forest green) */
    --board:#1f3d35;       /* primary buttons, active states, header furniture */
    --board-2:#173029;     /* primary hover (darker) */
    --board-line:#2c5247;  /* green-on-green detail line */

    /* Accent (amber) */
    --accent:#e0982e;      /* selection, focus, highlights, brand mark */
    --accent-soft:#fbe6c8; /* tinted backgrounds */
    --accent-deep:#b9781f; /* pressed / strong amber */

    /* Status */
    --danger:#c43d35;      --danger-soft:#f7e0de;
    --together:#2f6f9f;    --together-soft:#dde9f3;  /* informational blue */
    --ok:#3f9e6b;          /* success green (added) */

    /* Elevation */
    --shadow:0 1px 2px rgba(20,40,33,.06),0 6px 18px rgba(20,40,33,.06);
    --shadow-sm:0 1px 2px rgba(20,40,33,.10);

    /* Shape */
    --radius:12px;

    /* Type */
    --sans:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono:ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  /* === BASE (STYLE_GUIDE §2) === */
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;font-family:var(--sans);color:var(--ink);background:var(--app-bg);
    -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;
  }
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}

  /* === FRAME (§6) === */
  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  .toolbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:9px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--ink);white-space:nowrap;}
  .brand .mark{width:16px;height:16px;border-radius:4px;background:var(--accent);
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.06);flex:none;}
  .brand small{font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted);font-size:11px;}
  .spacer{flex:1;}
  .main{flex:1;display:flex;min-height:0;}
  .panel{width:344px;flex:none;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;}
  .stage{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--app-bg);}

  /* === COMPONENTS (§7) === */
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);
    padding:8px 13px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s,transform .05s;}
  .btn:hover{background:var(--panel-2);}
  .btn:active{transform:translateY(1px);}
  .btn.primary{background:var(--board);border-color:var(--board);color:#fff;}
  .btn.primary:hover{background:var(--board-2);}
  .btn.danger{color:var(--danger);border-color:var(--danger-soft);background:var(--panel);}
  .btn.danger:hover{background:var(--danger-soft);}
  .btn.small{padding:5px 9px;font-size:12px;border-radius:7px;}
  .btn[disabled]{opacity:.45;cursor:not-allowed;}
  .btn .ic{font-size:15px;line-height:1;}

  textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 10px;
    resize:vertical;min-height:78px;background:var(--panel-2);line-height:1.5;}
  select,input[type=number],input[type=text].in{
    border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel-2);}
  input[type=text].in{width:100%;}
  input[type=number]{width:72px;}
  select{max-width:100%;}

  .seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;}
  .seg button{border:none;background:var(--panel);padding:6px 12px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);}
  .seg button.active{background:var(--board);color:#fff;}

  .section-title{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);margin:0 0 9px;}
  .count-pill{font-family:var(--mono);font-size:11px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:20px;padding:2px 9px;color:var(--muted);}
  .hint{font-size:12px;color:var(--muted);line-height:1.5;}
  .empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);
    font-size:12.5px;line-height:1.55;background:var(--panel-2);}
  .xbtn{border:none;background:none;cursor:pointer;color:var(--muted);font-size:16px;
    line-height:1;padding:2px 6px;border-radius:6px;}
  .xbtn:hover{color:var(--danger);background:var(--danger-soft);}

  .statusbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:0 16px;min-height:42px;
    border-top:1px solid var(--line);background:var(--panel);font-size:13px;color:var(--muted);}
  .statusbar .stat b{font-family:var(--mono);font-weight:600;color:var(--ink);}
  .statusbar .stat.warn b,.statusbar .stat.warn{color:var(--danger);}
  .statusbar .dotline{width:1px;height:18px;background:var(--line);}
  .statusbar .stamp{margin-left:auto;font-family:var(--mono);font-size:11.5px;}

  .toast-wrap{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:1000;
    display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:var(--ink);color:#fff;padding:10px 15px;border-radius:10px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:min(92vw,560px);
    border-left:3px solid var(--accent);animation:tin .2s ease both;}
  .toast.warn{border-left-color:var(--accent);}
  .toast.err{border-left-color:var(--danger);}
  .toast.ok{border-left-color:var(--ok);}
  @keyframes tin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* === APP: question list (panel) === */
  .panel-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;}
  .filters{display:flex;gap:6px;}
  .filters select{flex:1;min-width:0;font-size:12.5px;padding:6px 3px;}
  .panel-meta{display:flex;align-items:center;justify-content:space-between;}
  .qlist{list-style:none;margin:0;padding:10px 12px;display:flex;flex-direction:column;gap:6px;overflow:auto;flex:1;}
  .qrow{display:flex;flex-direction:column;gap:3px;width:100%;text-align:left;padding:8px 10px;
    border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;color:var(--ink);}
  .qrow:hover{background:var(--panel-2);}
  .qrow.sel{box-shadow:0 0 0 2px var(--accent);}
  .qrow .top{display:flex;gap:6px;align-items:center;}
  .qrow .snip{font-size:13px;line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .qrow .sub{font-size:11.5px;color:var(--muted);}
  .badge{font-family:var(--mono);font-size:10.5px;font-weight:600;border:1px solid var(--line);
    border-radius:20px;padding:1px 8px;background:var(--panel-2);color:var(--muted);white-space:nowrap;}
  .badge.review{background:var(--accent-soft);color:var(--ink);border-color:var(--accent);}

  /* === APP: stage / editor === */
  .stage-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);}
  .stage-bar h2{margin:0;font-size:14px;}
  .dirty-flag{font-family:var(--mono);font-size:11.5px;color:var(--accent-deep);}
  .canvas-scroll{flex:1;overflow:auto;padding:16px;}
  .mathbar{position:sticky;top:-16px;z-index:5;margin:-16px -16px 14px;padding:8px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
  .mathbar .lab{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-right:4px;}
  .mathbar .btn{font-family:var(--mono);min-width:34px;justify-content:center;}
  .editor-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:14px;align-items:start;}
  .editor-grid > .col-preview{position:sticky;top:48px;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px;margin-bottom:14px;}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field > label,.lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .opt-row{display:flex;align-items:center;gap:8px;margin-bottom:7px;}
  .opt-row .letter{font-family:var(--mono);font-weight:600;width:22px;text-align:center;color:var(--muted);}
  .opt-row input[type=radio]{width:16px;height:16px;accent-color:var(--board);flex:none;}
  .opt-row .in{flex:1;}
  .check{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;margin-bottom:12px;user-select:none;}
  .check input{width:16px;height:16px;accent-color:var(--board);}
  .problems{margin:0;padding-left:18px;font-size:13px;line-height:1.5;}
  .problems li{margin-bottom:3px;}
  .problems .kind{font-family:var(--mono);font-size:11px;font-weight:600;}
  .note-box{background:var(--accent-soft);border-radius:8px;padding:8px 10px;font-size:12.5px;margin-bottom:10px;}
  .ok-line{font-size:13px;color:var(--ink);}
  .ok-line b{color:var(--ok);}
  .paper{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 18px;}

  /* === APP: modal (no §7 component exists yet; built from tokens) === */
  .modal-back{position:fixed;inset:0;background:rgba(20,40,33,.45);display:flex;align-items:center;
    justify-content:center;z-index:900;padding:16px;}
  .modal{background:var(--panel);border-radius:var(--radius);box-shadow:0 8px 24px rgba(20,40,33,.25);
    max-width:600px;width:100%;max-height:90vh;overflow:auto;padding:20px;}
  .modal h3{margin:0 0 10px;font-size:16px;}
  .modal p{margin:0 0 10px;line-height:1.5;}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px;}
  .sumtbl{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0 10px;}
  .sumtbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:4px 8px;}
  .sumtbl th:first-child,.sumtbl td:first-child{text-align:left;}
  .sumtbl td{padding:5px 8px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono);}
  .sumtbl td:first-child{font-family:var(--sans);}
  .changes{margin:0 0 10px;padding-left:18px;font-size:12.5px;line-height:1.5;}
  .changes li{margin-bottom:3px;}
  .progress-bar{height:8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);overflow:hidden;}
  .progress-bar > div{height:100%;background:var(--board);width:0;transition:width .12s;}

  @media (max-width:1180px){ .editor-grid{grid-template-columns:minmax(0,1fr);} .editor-grid > .col-preview{position:static;} }
  /* §10 */
  @media (max-width:880px){
    .main{flex-direction:column;}
    .panel{width:100%;max-height:46vh;border-right:none;border-bottom:1px solid var(--line);}
    .stage{min-height:54vh;}
    .row2{grid-template-columns:1fr;}
  }
  /* §9 */
  @media (prefers-reduced-motion:reduce){
    .btn:active{transform:none;} *{scroll-behavior:auto;} .toast{animation:none;} .progress-bar > div{transition:none;}
  }

  /* === APP: modes, tables, images, test builder === */
  .modeseg{margin-left:6px;}
  .tbl-scroll{overflow-x:auto;}
  .tbl-edit{border-collapse:separate;border-spacing:4px;}
  .tbl-edit th,.tbl-edit td{padding:0;font-weight:inherit;vertical-align:middle;}
  .tbl-edit .in{min-width:90px;}
  .tbl-x{text-align:center;}
  .thumbs{display:flex;flex-wrap:wrap;gap:10px;}
  .thumb{border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:6px;display:flex;align-items:flex-start;gap:4px;}
  .thumb img{max-width:140px;max-height:110px;display:block;}
  .trow{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:6px;}
  .trow.missing{border-style:dashed;background:var(--danger-soft);}
  .trow .num{font-family:var(--mono);font-weight:600;color:var(--muted);min-width:24px;text-align:right;}
  .trow .tmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .trow .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
  .trow .snip{font-size:13px;}
  .tbtns{display:flex;gap:2px;flex:none;}
  .tbtns .xbtn:hover{color:var(--ink);background:var(--panel-2);}
  .tbtns .xbtn:last-child:hover{color:var(--danger);background:var(--danger-soft);}
  .tbtns .xbtn[disabled]{opacity:.3;cursor:not-allowed;}
  .print-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .mono{font-family:var(--mono);font-weight:600;}
  .paper-sheet{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:16px;overflow:auto;}
  .paper-sheet .sheet{background:var(--panel);max-width:8.5in;margin:0 auto;padding:.6in .55in;box-shadow:var(--shadow);}

  /* === The printed test and answer key. Plain black on white (school copiers are greyscale); no colour carries meaning.
     Layout avoids flex and grid inside the questions so page breaks stay reliable on older browsers. === */
  .sheet{font-family:Helvetica,Arial,"Liberation Sans",sans-serif;color:#000;background:#fff;font-size:11pt;line-height:1.35;}
  .sheet h1{font-size:18pt;margin:0 0 2pt;line-height:1.2;}
  .sheet .tp-head{border-bottom:1.5pt solid #000;padding-bottom:8pt;margin-bottom:12pt;}
  .sheet .tp-version{float:right;font-weight:700;border:1.5pt solid #000;padding:1pt 8pt;margin-left:12pt;}
  .sheet .tp-lines{display:flex;gap:24pt;margin-top:12pt;}
  .sheet .tp-line{flex:2;border-bottom:1pt solid #000;padding-bottom:1pt;}
  .sheet .tp-line.tp-short{flex:1;}
  .sheet .tp-block{break-inside:avoid;page-break-inside:avoid;margin-bottom:12pt;}
  .sheet .tp-intro{font-style:italic;margin-bottom:5pt;}
  .sheet .tp-stim{border:1pt solid #000;padding:8pt;margin-bottom:10pt;}
  .sheet .tp-stim-title{font-weight:700;margin-bottom:3pt;}
  .sheet .tp-text{white-space:pre-wrap;overflow-wrap:anywhere;}
  .sheet .tp-q{position:relative;padding-left:30pt;margin:0 0 12pt;break-inside:avoid;page-break-inside:avoid;}
  .sheet .tp-block .tp-q:last-child{margin-bottom:0;}
  .sheet .tp-num{position:absolute;left:0;width:22pt;text-align:right;font-weight:700;}
  .sheet .tp-opts{margin-top:5pt;}
  .sheet .tp-opt{position:relative;padding-left:22pt;margin:2pt 0;break-inside:avoid;page-break-inside:avoid;}
  .sheet .tp-let{position:absolute;left:0;font-weight:700;}
  .sheet .tp-tf{margin-top:6pt;}
  .sheet .tp-tfopt{display:inline-block;border:1pt solid #000;border-radius:10pt;padding:0 12pt;margin-left:14pt;}
  .sheet .tp-numeric{margin-top:8pt;}
  .sheet .tp-blankline{display:inline-block;width:180pt;border-bottom:1pt solid #000;margin-left:8pt;}
  .sheet .tp-rules{margin-top:4pt;}
  .sheet .tp-rule{border-bottom:1pt solid #000;height:22pt;}
  .sheet .tp-match{display:table;width:100%;margin-top:6pt;}
  .sheet .tp-mcol{display:table-cell;width:50%;vertical-align:top;padding-right:14pt;}
  .sheet .tp-mrow{position:relative;margin:3pt 0;}
  .sheet .tp-mrow.l{padding-left:56pt;}
  .sheet .tp-mrow.l .tp-let{left:34pt;}
  .sheet .tp-mrow.r{padding-left:22pt;}
  .sheet .tp-mblank{position:absolute;left:0;width:28pt;top:0;height:1.1em;border-bottom:1pt solid #000;}
  .sheet .pq-table{border-collapse:collapse;margin:5pt 0;}
  .sheet .pq-table th,.sheet .pq-table td{border:1pt solid #000;padding:2pt 7pt;text-align:left;}
  .sheet .pq-tablewrap{break-inside:avoid;page-break-inside:avoid;margin:5pt 0;}
  .sheet .pq-cap{font-weight:700;padding-bottom:2pt;}
  .sheet .tp-imgs img{max-width:100%;max-height:90mm;margin:4pt 8pt 0 0;}
  .sheet .tp-key{width:100%;border-collapse:collapse;}
  .sheet .tp-key th,.sheet .tp-key td{border:1pt solid #000;padding:4pt 8pt;text-align:left;vertical-align:top;}
  .sheet .tp-key tr{break-inside:avoid;page-break-inside:avoid;}
  #print-root{display:none;color:#000;background:#fff;}
  @media print{
    html,body{height:auto;background:#fff;}
    .app,.toast-wrap,.modal-back{display:none !important;}
    #print-root{display:block;}
  }

math {
  font-family: "Cambria Math", 'STIXTwoMath-Regular', 'NotoSansMath-Regular', math;
  font-style: normal;
  font-weight: normal;
  line-height: normal;
  font-size-adjust: none;
  text-indent: 0;
  text-transform: none;
  letter-spacing: normal;
  word-wrap: normal;
  direction: ltr;
  /* Prevent Firefox from omitting the dot on i or j. */
  font-feature-settings: "dtls" off;
}

math * {
  border-color: currentColor;
}

/* display: block is necessary in Firefox and Safari.
 * Not in Chromium, which recognizes display: "block math" written inline. */
 math.tml-display {
  display: block;
  width: 100%;
}

*.mathcal {
  /* NotoSans */
  font-feature-settings: 'ss01';
}

math .mathscr {
  font-family: "Temml";
}

mo.tml-prime {
  font-family: Temml;
}

/* Cramped superscripts in WebKit */
mfrac > :nth-child(2),
msqrt,
mover > :first-child {
  math-shift: compact
}

.menclose {
  display: inline-block;
  position: relative;
  padding: 0.5ex 0ex;
}
.tml-cancelto {
  display: inline-block;
  position: absolute;
  top: 0;
  left: 0;
  padding: 0.5ex 0ex;
  background-color: currentColor;
  /* Use the SVG as an alpha mask (painted by background-color) */
  -webkit-mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
          mask-image: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg'><defs><marker id='a' markerHeight='5' markerUnits='strokeWidth' markerWidth='7' orient='auto' refX='7' refY='2.5'><path fill='black' d='m0 0 7 2.5L0 5z'/></marker></defs><line x2='100%25' y1='100%25' stroke='black' stroke-width='.06em' marker-end='url(%23a)' vector-effect='non-scaling-stroke'/></svg>");
  -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
  -webkit-mask-size: 100% 100%;
          mask-size: 100% 100%;
  -webkit-mask-position: 0 0;
          mask-position: 0 0;
}

@supports (-moz-appearance: none) {
  /* \vec w/o italic correction for Firefox */
  .tml-vec {
    transform: scale(0.75)
  }
  /* Fix \cancelto in Firefox */
  .ff-narrow {
    width: 0em;
  }
  .ff-nudge-left {
    margin-left: -0.2em;
  }
  /* Squash hidden mrows in \bordermatrix. Messes with centering, but necessary to squash. */
  .ff-squash mtd {
    display: block;
    height: 0;
  }
}

@supports (not (-moz-appearance: none)) {
  /* Chromium and WebKit */
  /* prime vertical alignment */
  mo.tml-prime {
    font-family: Temml;
  }
  /* Italic correction on superscripts */
  .tml-sml-pad {
    padding-left: 0.05em;
  }
  .tml-med-pad {
    padding-left: 0.10em;
  }
  .tml-lrg-pad {
    padding-left: 0.15em;
  }
}

@supports (-webkit-backdrop-filter: blur(1px)) {
  /* WebKit vertical & italic correction on accents */
  .wbk-acc {
    /* lower by x-height distance */
    transform: translate(0em, 0.431em);
  }
  .wbk-sml {
    transform: translate(0.07em, 0);
  }
  .wbk-sml-acc {
    transform: translate(0.07em, 0.431em);
  }
  .wbk-sml-vec {
    transform: scale(0.75) translate(0.07em, 0);
  }
  .wbk-med {
    transform: translate(0.14em, 0);
  }
  .wbk-med-acc {
    transform: translate(0.14em, 0.431em);
  }
  .wbk-med-vec {
    transform: scale(0.75) translate(0.14em, 0);
  }
  .wbk-lrg {
    transform: translate(0.21em, 0);
  }
  .wbk-lrg-acc {
    transform: translate(0.21em, 0.431em);
  }
  .wbk-lrg-vec {
    transform: scale(0.75) translate(0.21em, 0);
  }
}

/* \cancel & \phase use background images. Get them to print. */
menclose {
  -webkit-print-color-adjust: exact;  /* Chrome & Edge */
          print-color-adjust: exact;
}

/* Array cell justification in Firefox & WebKit */
.tml-right {
  text-align: right;
}
.tml-left {
  text-align: left;
}

/* For CD labels that grow to the left in Firefox and WebKit */
.tml-shift-left { margin-left:-200% }

/* Styles for Chromium only */
@supports (not (-webkit-backdrop-filter: blur(1px))) and (not (-moz-appearance: none)) {

  }
  .chr-sml-vec {
    transform: scale(0.75) translate(0.07em, 0)
  }
  .chr-med {
    transform: translate(0.14em, 0)
  }
  .chr-med-vec {
    transform: scale(0.75) translate(0.14em, 0)

  .tml-shift-left { margin-left:-100% }

  menclose {

}

}

/* flex-wrap for line-breaking in Chromium */

<body>
<div id="root"></div>
<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>

<script id="app-js">
document.addEventListener('DOMContentLoaded', () => {
'use strict';

/* === CONSTANTS === */
const APP_VERSION = '0.2.0';
const SCHEMA_VERSION = 2;
const FORMAT = 'prime-questions';
const KNOWN_FEATURES = [];                 // payload.requiredFeatures entries this app understands
const DB_NAME = 'prime-questions';
const LS = 'prime-questions:';             // localStorage key prefix (UI prefs only)
const ATTACHMENT_NAME = 'prime-questions.pq';
const MAX_PDF_BYTES = 256 * 1024 * 1024;   // refuse bigger imports (untrusted input)
const TYPES = ['mc', 'tf', 'numeric', 'short', 'matching'];
const TYPE_LABEL = { mc: 'Multiple Choice', tf: 'True / False', numeric: 'Numeric', short: 'Short Answer', matching: 'Matching' };
const TYPE_SHORT = { mc: 'MC', tf: 'T/F', numeric: 'NUM', short: 'SHORT', matching: 'MATCH' };
const DIFFICULTIES = ['easy', 'medium', 'hard'];
const STATUSES = ['ready', 'review'];
const STATUS_LABEL = { ready: 'Ready', review: 'Needs review' };

/* === UTIL === */
const nowIso = () => new Date().toISOString();
const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
const clone = v => JSON.parse(JSON.stringify(v));

function uuid() {
  if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const x = Array.from(b, v => v.toString(16).padStart(2, '0'));
  return x.slice(0, 4).join('') + '-' + x.slice(4, 6).join('') + '-' + x.slice(6, 8).join('') + '-' + x.slice(8, 10).join('') + '-' + x.slice(10).join('');
}

// JSON with sorted keys, so equal content always compares equal
function stable(v) {
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  if (v && typeof v === 'object') return '{' + Object.keys(v).sort().map(k => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
  return JSON.stringify(v);
}

const ls = {
  get(k) { try { return localStorage.getItem(LS + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(LS + k, v); } catch (e) { /* storage blocked: UI prefs only */ } }
};

function dataUrlToBlob(url) {
  const m = /^data:([a-z]+\/[a-z0-9.+-]+);base64,/i.exec(url);
  if (!m) throw new Error('Not a base64 data URL');
  const bin = atob(url.slice(m[0].length));
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return new Blob([u8], { type: m[1] });
}
function blobToDataUrl(blob) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.readAsDataURL(blob);
  });
}
const IMAGE_URL_RE = /^data:image\/(png|jpeg|gif|webp|svg\+xml);base64,[A-Za-z0-9+/]*={0,2}$/;

/* === MATH CHECKING (pure, needs the temml global only when called) === */
// Split text into plain and \( math \) parts; report unbalanced delimiters.
function splitMath(text) {
  const parts = [], errors = [];
  let i = 0;
  while (i < text.length) {
    const a = text.indexOf('\\(', i);
    if (a < 0) { parts.push({ math: false, text: text.slice(i) }); break; }
    if (a > i) parts.push({ math: false, text: text.slice(i, a) });
    const b = text.indexOf('\\)', a + 2);
    if (b < 0) { errors.push('A \\( has no closing \\)'); parts.push({ math: false, text: text.slice(a) }); break; }
    parts.push({ math: true, tex: text.slice(a + 2, b) });
    i = b + 2;
  }
  for (const p of parts) if (!p.math && p.text.indexOf('\\)') >= 0) { errors.push('A \\) has no matching \\('); break; }
  return { parts, errors };
}

function mathErrors(text) {
  const { parts, errors } = splitMath(text);
  const out = errors.slice();
  for (const p of parts) {
    if (!p.math) continue;
    if (!p.tex.trim()) { out.push('Empty math: \\( \\)'); continue; }
    try { temml.renderToString(p.tex, { throwOnError: true, displayMode: false }); }
    catch (e) { out.push(String(e && e.message || e).replace(/^Temml parse error:\s*/, '')); }
  }
  return out;
}

/* === QUESTIONS: shape, text fields, readiness === */
function defaultAnswer(type) {
  switch (type) {
    case 'mc': return { options: ['', '', '', ''], correct: 0 };
    case 'tf': return { correct: true };
    case 'numeric': return { value: '', units: '', tolerance: 0 };
    case 'short': return { lines: 6, rubric: '' };
    case 'matching': return { pairs: [{ left: '', right: '' }, { left: '', right: '' }] };
  }
  throw new Error('Unknown question type: ' + type);
}

function emptyQuestion(type) {
  const t = nowIso();
  return {
    id: uuid(), type: type || 'mc', prompt: '', course: '', unit: '', tags: [],
    difficulty: 'medium', status: 'review', stimulusId: null, imageIds: [], table: null,
    answer: defaultAnswer(type || 'mc'), notes: '', created: t, updated: t
  };
}

const letter = i => i < 26 ? String.fromCharCode(65 + i) : String(i + 1);

// Text fields of a table (caption, headers, cells), for maths checking.
function tableFields(t, label) {
  const f = [];
  if (!t) return f;
  f.push({ field: label + ' caption', text: t.caption || '' });
  (t.headers || []).forEach((x, i) => f.push({ field: label + ' header ' + (i + 1), text: x }));
  (t.rows || []).forEach((r, i) => r.forEach((x, j) => f.push({ field: label + ' row ' + (i + 1) + ', column ' + (j + 1), text: x })));
  return f;
}

// Every text field that may hold \( math \), with a label for error messages.
function textFields(q) {
  const f = [{ field: 'Question text', text: q.prompt }];
  const a = q.answer || {};
  f.push(...tableFields(q.table, 'Table'));
  if (q.type === 'mc') (a.options || []).forEach((o, i) => f.push({ field: 'Option ' + letter(i), text: o }));
  if (q.type === 'numeric') { f.push({ field: 'Answer value', text: a.value || '' }); f.push({ field: 'Units', text: a.units || '' }); }
  if (q.type === 'short') f.push({ field: 'Marking guide', text: a.rubric || '' });
  if (q.type === 'matching') (a.pairs || []).forEach((p, i) => { f.push({ field: 'Pair ' + (i + 1) + ' left', text: p.left }); f.push({ field: 'Pair ' + (i + 1) + ' right', text: p.right }); });
  f.push({ field: 'Notes', text: q.notes || '' });
  return f;
}

// Problems that stop a question being marked "ready": broken math and missing content.
function checkQuestion(q) {
  const out = [];
  const a = q.answer || {};
  if (!String(q.prompt || '').trim()) out.push({ kind: 'incomplete', field: 'Question text', message: 'is empty' });
  if (q.type === 'mc') {
    const opts = a.options || [];
    if (opts.filter(o => String(o).trim()).length < 2) out.push({ kind: 'incomplete', field: 'Options', message: 'need at least two filled-in options' });
    if (!Number.isInteger(a.correct) || a.correct < 0 || a.correct >= opts.length || !String(opts[a.correct] || '').trim())
      out.push({ kind: 'incomplete', field: 'Correct answer', message: 'pick a filled-in option as the correct one' });
  } else if (q.type === 'tf') {
    if (typeof a.correct !== 'boolean') out.push({ kind: 'incomplete', field: 'Correct answer', message: 'choose True or False' });
  } else if (q.type === 'numeric') {
    if (!String(a.value || '').trim()) out.push({ kind: 'incomplete', field: 'Answer value', message: 'is empty' });
    if (!(typeof a.tolerance === 'number' && a.tolerance >= 0)) out.push({ kind: 'incomplete', field: 'Tolerance', message: 'must be 0 or more' });
  } else if (q.type === 'short') {
    if (!Number.isInteger(a.lines) || a.lines < 1) out.push({ kind: 'incomplete', field: 'Answer lines', message: 'must be a whole number, 1 or more' });
  } else if (q.type === 'matching') {
    const pairs = a.pairs || [];
    if (pairs.length < 2 || pairs.some(p => !String(p.left).trim() || !String(p.right).trim()))
      out.push({ kind: 'incomplete', field: 'Pairs', message: 'need at least two pairs, each filled in on both sides' });
  }
  for (const f of textFields(q)) for (const m of mathErrors(String(f.text || ''))) out.push({ kind: 'math', field: f.field, message: m });
  return out;
}

/* === PAYLOAD: validation, migration, merge === */
// { fromVersion: payload => payload at fromVersion + 1 }
// 1 -> 2: questions may carry an optional boolean `keepOrder` (absent = false). A schema 1 bank has none, so only the version changes.
const MIGRATIONS = { 1: p => Object.assign({}, p, { schemaVersion: 2 }) };

function migrate(p, migrations, target) {
  migrations = migrations || MIGRATIONS;
  target = target || SCHEMA_VERSION;
  let cur = p;
  while (cur.schemaVersion < target) {
    const from = cur.schemaVersion, step = migrations[from];
    if (!step) throw new Error('No migration from schema ' + from);
    cur = step(cur);
    if (!cur || cur.schemaVersion !== from + 1) throw new Error('Migration from schema ' + from + ' did not produce schema ' + (from + 1));
  }
  return cur;
}

const isStr = v => typeof v === 'string';
const isIso = v => isStr(v) && !isNaN(Date.parse(v));
const isStrArr = v => Array.isArray(v) && v.every(isStr);

function checkTable(t) {
  return t === null || (t && typeof t === 'object' && isStrArr(t.headers) && Array.isArray(t.rows) &&
    t.rows.every(isStrArr) && isStr(t.caption));
}

function recordProblems(kind, r) {
  const e = [];
  const need = (ok, m) => { if (!ok) e.push(m); };
  if (!r || typeof r !== 'object' || Array.isArray(r)) return ['is not a record'];
  need(isStr(r.id) && r.id.length > 0 && r.id.length <= 200, 'has no valid id');
  need(isIso(r.created) && isIso(r.updated), 'has an invalid created/updated date');
  if (kind === 'question') {
    need(TYPES.includes(r.type), 'has an unknown type');
    need(isStr(r.prompt) && isStr(r.course) && isStr(r.unit) && isStr(r.notes), 'has a text field that is not text');
    need(isStrArr(r.tags), 'has invalid tags');
    need(DIFFICULTIES.includes(r.difficulty), 'has an invalid difficulty');
    need(STATUSES.includes(r.status), 'has an invalid status');
    need(r.stimulusId === null || isStr(r.stimulusId), 'has an invalid stimulusId');
    need(isStrArr(r.imageIds), 'has invalid imageIds');
    need(checkTable(r.table), 'has an invalid table');
    need(r.keepOrder === undefined || typeof r.keepOrder === 'boolean', 'has an invalid keepOrder');
    const a = r.answer;
    if (!a || typeof a !== 'object') e.push('has no answer');
    else if (r.type === 'mc') need(isStrArr(a.options) && a.options.length >= 2 && Number.isInteger(a.correct) && a.correct >= 0 && a.correct < a.options.length, 'has an invalid multiple-choice answer');
    else if (r.type === 'tf') need(typeof a.correct === 'boolean', 'has an invalid true/false answer');
    else if (r.type === 'numeric') need(isStr(a.value) && isStr(a.units) && typeof a.tolerance === 'number' && isFinite(a.tolerance), 'has an invalid numeric answer');
    else if (r.type === 'short') need(Number.isInteger(a.lines) && isStr(a.rubric), 'has an invalid short-answer answer');
    else if (r.type === 'matching') need(Array.isArray(a.pairs) && a.pairs.every(p => p && isStr(p.left) && isStr(p.right)), 'has invalid matching pairs');
  } else if (kind === 'stimulus') {
    need(isStr(r.title) && isStr(r.text), 'has a text field that is not text');
    need(isStrArr(r.imageIds), 'has invalid imageIds');
    need(checkTable(r.table), 'has an invalid table');
  } else if (kind === 'test') {
    need(isStr(r.title) && isStr(r.course), 'has a text field that is not text');
    need(isStrArr(r.questionIds), 'has invalid questionIds');
    need(Number.isInteger(r.seed), 'has an invalid seed');
  }
  return e;
}

// Full check of an untrusted, already-parsed payload. Never throws.
// Returns { ok:true, payload } or { ok:false, code, errors:[...] }.
function parsePayload(p) {
  const fail = (code, msg) => ({ ok: false, code, errors: Array.isArray(msg) ? msg : [msg] });
  if (!p || typeof p !== 'object' || Array.isArray(p) || p.format !== FORMAT)
    return fail('format', 'This is not a Prime Questions bank (its format field is missing or different).');
  if (!Number.isInteger(p.schemaVersion) || p.schemaVersion < 1)
    return fail('schema', 'The bank has no valid schemaVersion.');
  if (p.schemaVersion > SCHEMA_VERSION)
    return fail('newer', 'This bank was saved by a newer Prime Questions (schema ' + p.schemaVersion + '; this copy understands up to ' + SCHEMA_VERSION + '). Open the newest version of Prime Questions and import it there. Nothing was changed.');
  let m;
  try { m = migrate(p); } catch (e) { return fail('migrate', 'Could not upgrade this older bank: ' + e.message); }
  if (!isStrArr(m.requiredFeatures)) return fail('features', 'The bank has no valid requiredFeatures list.');
  const unknown = m.requiredFeatures.filter(f => !KNOWN_FEATURES.includes(f));
  if (unknown.length) return fail('features', 'This bank needs features this copy of Prime Questions does not have: ' + unknown.join(', ') + '. Nothing was changed.');
  const errors = [];
  const add = msg => { if (errors.length < 15) errors.push(msg); };
  for (const [key, kind] of [['questions', 'question'], ['stimuli', 'stimulus'], ['tests', 'test']]) {
    if (!Array.isArray(m[key])) { add('"' + key + '" is missing or not a list.'); continue; }
    const seen = new Set();
    m[key].forEach((r, i) => {
      for (const prob of recordProblems(kind, r)) add('The ' + kind + ' at position ' + (i + 1) + ' ' + prob + '.');
      if (r && isStr(r.id)) { if (seen.has(r.id)) add('The id "' + r.id + '" appears twice in ' + key + '.'); seen.add(r.id); }
    });
  }
  if (!m.images || typeof m.images !== 'object' || Array.isArray(m.images)) add('"images" is missing or not a map.');
  else for (const id of Object.keys(m.images)) {
    if (id === '__proto__' || id.length > 200) add('An image has an invalid id.');
    else if (!isStr(m.images[id]) || !IMAGE_URL_RE.test(m.images[id])) add('Image "' + id + '" is not a PNG, JPEG, GIF, WebP or SVG data URL.');
  }
  if (errors.length) return { ok: false, code: 'invalid', errors: errors.concat(['Nothing was imported.']) };
  return { ok: true, payload: m };
}

// Merge plan: nothing is applied here. local = {questions, stimuli, tests, imageIds:Set}, incoming = parsed payload.
// "changed" = same id, different content. Newer `updated` wins; a tie keeps the local copy.
function planMerge(local, incoming) {
  const plan = { collections: {}, images: { new: [], existing: 0 } };
  for (const c of ['questions', 'stimuli', 'tests']) {
    const byId = new Map(local[c].map(r => [r.id, r]));
    const res = { new: [], changed: [], unchanged: [] };
    for (const r of incoming[c]) {
      const l = byId.get(r.id);
      if (!l) { res.new.push(r); continue; }
      if (stable(l) === stable(r)) { res.unchanged.push(r); continue; }
      const lu = Date.parse(l.updated), iu = Date.parse(r.updated);
      const winner = iu > lu ? 'incoming' : 'local';
      const reason = iu > lu ? 'the file has the newer copy' : iu < lu ? 'your copy is newer' : 'both were saved at the same time, so your copy is kept';
      res.changed.push({ id: r.id, local: l, incoming: r, winner, reason });
    }
    plan.collections[c] = res;
  }
  // image ids are never reused and an image's content never changes, so an id we have is unchanged
  for (const id of Object.keys(incoming.images)) {
    if (local.imageIds.has(id)) plan.images.existing++; else plan.images.new.push(id);
  }
  return plan;
}

function recordsToWrite(plan) {
  const out = {};
  for (const c of ['questions', 'stimuli', 'tests']) {
    const r = plan.collections[c];
    out[c] = r.new.concat(r.changed.filter(x => x.winner === 'incoming').map(x => x.incoming));
  }
  return out;
}

function planIsNoop(plan) {
  const w = recordsToWrite(plan);
  return !w.questions.length && !w.stimuli.length && !w.tests.length && !plan.images.new.length;
}

/* === TESTS: seeded shuffle, versions, answer keys (pure, no DOM) === */
// 32-bit FNV-1a of "seed|label": gives every shuffle its own stable stream, so editing one
// question never changes how another one is shuffled.
function hashSeed(seed, label) {
  let x = 0x811c9dc5;
  const s = String(seed) + '|' + label;
  for (let i = 0; i < s.length; i++) { x ^= s.charCodeAt(i); x = Math.imul(x, 0x01000193); }
  return x >>> 0;
}
function mulberry32(a) {
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffled(arr, rnd) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function newSeed() { return (crypto.getRandomValues(new Uint32Array(1))[0] % 2147483646) + 1; }

// Questions that share a stimulus form one block, placed where the first of them appears.
// A stimulus that is not in the bank leaves its questions standing alone.
function formBlocks(questions, stimById) {
  const blocks = [], byStim = new Map();
  for (const q of questions) {
    if (q.stimulusId && stimById.has(q.stimulusId)) {
      let b = byStim.get(q.stimulusId);
      if (!b) { b = { stimulusId: q.stimulusId, questions: [] }; byStim.set(q.stimulusId, b); blocks.push(b); }
      b.questions.push(q);
    } else blocks.push({ stimulusId: null, questions: [q] });
  }
  return blocks;
}

// What one question looks like on the paper for a version. Blank options are not printed.
function questionView(q, seed, version) {
  const a = q.answer;
  if (q.type === 'mc') {
    let opts = a.options.map((text, orig) => ({ text, orig })).filter(o => String(o.text).trim() !== '');
    if (version === 'B' && !q.keepOrder) opts = shuffled(opts, mulberry32(hashSeed(seed, 'opt|' + q.id)));
    return { type: 'mc', options: opts, correct: opts.findIndex(o => o.orig === a.correct), shuffled: version === 'B' && !q.keepOrder };
  }
  if (q.type === 'tf') return { type: 'tf', correct: a.correct };
  if (q.type === 'numeric') return { type: 'numeric', value: a.value, units: a.units, tolerance: a.tolerance };
  if (q.type === 'short') return { type: 'short', lines: Math.max(1, a.lines), rubric: a.rubric };
  // matching: the right-hand column is always shuffled (the pairs are stored in true order); never left in place
  const n = a.pairs.length, idx = a.pairs.map((_, i) => i);
  const rnd = mulberry32(hashSeed(seed, 'match|' + version + '|' + q.id));
  let order = shuffled(idx, rnd);
  for (let t = 0; t < 10 && n > 1 && order.every((v, i) => v === i); t++) order = shuffled(idx, rnd);
  return { type: 'matching', left: a.pairs.map(p => p.left), right: order.map(i => a.pairs[i].right), key: idx.map(i => order.indexOf(i)) };
}

// The test for a version. A: the order you chose (stimulus questions pulled together).
// B: the blocks in a seeded shuffled order and each MC question's options shuffled, unless it has keepOrder.
// Questions missing from the bank are skipped and listed in `missing`.
function planTest(test, questions, stimuli, version) {
  const qById = new Map(questions.map(q => [q.id, q])), sById = new Map(stimuli.map(s => [s.id, s]));
  const ordered = [], missing = [];
  for (const id of test.questionIds) { const q = qById.get(id); if (q) ordered.push(q); else missing.push(id); }
  const blocksA = formBlocks(ordered, sById);
  const aNumber = new Map();
  let n = 0;
  for (const b of blocksA) for (const q of b.questions) aNumber.set(q.id, ++n);
  const blocks = version === 'B' ? shuffled(blocksA, mulberry32(hashSeed(test.seed, 'blocks'))) : blocksA;
  let num = 0;
  const out = blocks.map(b => ({
    stimulus: b.stimulusId ? sById.get(b.stimulusId) : null,
    items: b.questions.map(q => ({ q, number: ++num, aNumber: aNumber.get(q.id), view: questionView(q, test.seed, version) }))
  }));
  return { version, title: test.title, course: test.course, blocks: out, total: num, missing };
}

// The answer as a short string, from the version's own view (so a B key shows B's letters).
function keyText(item) {
  const v = item.view;
  if (v.type === 'mc') return v.correct >= 0 ? letter(v.correct) + '. ' + v.options[v.correct].text : '(no correct option set)';
  if (v.type === 'tf') return v.correct ? 'True' : 'False';
  if (v.type === 'numeric') return v.value + (v.units ? ' ' + v.units : '') + (v.tolerance ? '  (±' + v.tolerance + ')' : '');
  if (v.type === 'short') return v.rubric || '(marked by the teacher)';
  return v.key.map((k, i) => (i + 1) + '-' + letter(k)).join('   ');
}
// Flat list for the key: Version B lines say which A question they are.
function keyEntries(plan) {
  const out = [];
  for (const b of plan.blocks) for (const it of b.items) out.push({ number: it.number, aNumber: it.aNumber, text: keyText(it), item: it });
  return out;
}

/* === PDF: low-level writer / reader (no library; browser built-ins only) === */
const enc = new TextEncoder();
const latin1 = s => { const o = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); o[i] = c < 256 ? c : 63; } return o; };
const concat = parts => { let n = 0; for (const p of parts) n += p.length; const o = new Uint8Array(n); let i = 0; for (const p of parts) { o.set(p, i); i += p.length; } return o; };
const pdfErr = (code, message) => Object.assign(new Error(message), { code });

async function deflate(bytes) {
  const cs = new CompressionStream('deflate');
  const w = cs.writable.getWriter();
  w.write(bytes).catch(() => {}); w.close().catch(() => {});
  return new Uint8Array(await new Response(cs.readable).arrayBuffer());
}
async function inflate(bytes, limit) {
  const ds = new DecompressionStream('deflate');
  const w = ds.writable.getWriter();
  w.write(bytes).catch(() => {}); w.close().catch(() => {});
  const r = ds.readable.getReader();
  const chunks = []; let n = 0;
  for (;;) {
    const { done, value } = await r.read();
    if (done) break;
    n += value.length;
    if (n > limit) { r.cancel().catch(() => {}); throw pdfErr('too-big', 'The data inside the PDF is too large.'); }
    chunks.push(value);
  }
  return concat(chunks);
}

const pstr = s => '(' + s.replace(/[\\()]/g, '\\$&').replace(/[^\x20-\x7e]/g, '?') + ')';

class Pdf {
  constructor() { this.objs = []; }
  reserve() { this.objs.push(null); return this.objs.length; }
  set(id, parts) { this.objs[id - 1] = parts; }
  add(parts) { const id = this.reserve(); this.set(id, parts); return id; }
  stream(dict, data) { return [enc.encode('<< ' + dict + ' /Length ' + data.length + ' >>\nstream\n'), data, enc.encode('\nendstream')]; }
  build(rootId, infoId) {
    const out = [latin1('%PDF-1.7\n%\xE2\xE3\xCF\xD3\n')];
    let off = out[0].length;
    const offs = [];
    this.objs.forEach((parts, i) => {
      offs.push(off);
      const p = Array.isArray(parts) ? parts : [enc.encode(parts)];
      for (const x of [enc.encode((i + 1) + ' 0 obj\n'), ...p, enc.encode('\nendobj\n')]) { out.push(x); off += x.length; }
    });
    let x = 'xref\n0 ' + (this.objs.length + 1) + '\n0000000000 65535 f \n';
    for (const o of offs) x += String(o).padStart(10, '0') + ' 00000 n \n';
    x += 'trailer\n<< /Size ' + (this.objs.length + 1) + ' /Root ' + rootId + ' 0 R' + (infoId ? ' /Info ' + infoId + ' 0 R' : '') + ' >>\nstartxref\n' + off + '\n%%EOF\n';
    out.push(enc.encode(x));
    return concat(out);
  }
}

// Reader. Finds the embedded Prime Questions file and returns its parsed JSON.
// Streams are always top-level objects, so this also works after other tools rewrite the PDF.
async function readPdfPayload(input) {
  const b = input instanceof Uint8Array ? input : new Uint8Array(input);
  if (b.length > MAX_PDF_BYTES) throw pdfErr('too-big', 'This file is too large to import.');
  const dec = new TextDecoder('latin1');   // one char per byte, so offsets match the bytes
  if (dec.decode(b.subarray(0, 1024)).indexOf('%PDF-') < 0) throw pdfErr('not-pdf', 'This file is not a PDF.');
  const s = dec.decode(b);
  const re = /\/Type\s*\/EmbeddedFile/g;
  let m, attachments = 0, lastErr = null;
  while ((m = re.exec(s))) {
    attachments++;
    try {
      const raw = await streamBytes(b, s, m.index);
      const json = JSON.parse(new TextDecoder('utf-8').decode(raw));
      if (json && json.format === FORMAT) return json;
    } catch (e) { lastErr = e; }
  }
  if (attachments === 0) throw pdfErr(/\/Encrypt\b/.test(s) ? 'encrypted' : 'no-data',
    /\/Encrypt\b/.test(s) ? 'This PDF is password-protected, so Prime Questions cannot read it.' : 'This PDF has no Prime Questions data. Was it printed or re-saved? Import only works from the original exported file.');
  throw pdfErr('no-data', 'This PDF has attached data, but none of it is a Prime Questions bank' + (lastErr ? ' (' + (lastErr.message || lastErr) + ')' : '') + '.');
}

async function streamBytes(b, s, idx) {
  const objStart = s.lastIndexOf(' obj', idx);     // NOT the last "<<": other tools put a nested /Params << >> first
  const kw = s.indexOf('stream', idx);
  if (objStart < 0 || kw < 0) throw pdfErr('bad-data', 'Damaged PDF structure.');
  const dict = s.slice(objStart, kw);
  let start = kw + 6;
  if (s[start] === '\r') start++;
  if (s[start] === '\n') start++;
  const lm = /\/Length\s+(\d+)(?!\d)(?!\s+\d+\s+R)/.exec(dict);   // direct lengths only
  const ends = [];
  if (lm) ends.push(start + Number(lm[1]));
  else {
    let e = s.indexOf('endstream', start);
    if (e > 0) { ends.push(e - (s[e - 1] === '\n' ? (s[e - 2] === '\r' ? 2 : 1) : s[e - 1] === '\r' ? 1 : 0)); ends.push(e); }
  }
  const fm = /\/Filter\s*(\[[^\]]*\]|\/[A-Za-z0-9]+)/.exec(dict);
  const filter = fm ? fm[1] : '';
  const flate = /FlateDecode|\bFl\b/.test(filter);
  if (filter && !(flate && !/ASCII|LZW|RunLength|DCT|CCITT|JBIG|JPX|Crypt/.test(filter))) throw pdfErr('bad-data', 'Unsupported compression in the attached data.');
  let err = null;
  for (const end of ends) {
    if (end > b.length || end < start) continue;
    try { return flate ? await inflate(b.subarray(start, end), MAX_PDF_BYTES) : b.slice(start, end); } catch (e) { err = e; }
  }
  throw err || pdfErr('bad-data', 'Could not read the attached data.');
}

const canDrawCp = cp => (cp >= 32 && cp <= 126) || (cp >= 160 && cp <= 255);
// Text can be drawn with the PDF's standard fonts only if every character is in U+0020-U+007E or U+00A0-U+00FF.
function isTextSafe(s) {
  for (const ch of String(s).replace(/[\r\n\t]/g, ' ')) if (!canDrawCp(ch.codePointAt(0))) return false;
  return true;
}
// Rule (c): math, or any character the standard fonts cannot draw, means this text is drawn as an image.
const needsImage = s => String(s).indexOf('\\(') >= 0 || !isTextSafe(s);
const safe = s => Array.from(String(s).replace(/\r/g, '').replace(/\t/g, ' '), ch => ch === '\n' || canDrawCp(ch.codePointAt(0)) ? ch : '?').join('');

function textWidth(str, bold, size) {
  const t = bold ? HELVB : HELV;
  let w = 0;
  for (const ch of str) { const cp = ch.codePointAt(0); w += (canDrawCp(cp) ? t[cp - 32] : t[63 - 32]); }
  return w * size / 1000;
}

function wrapText(text, bold, size, maxW) {
  const out = [];
  for (const para of safe(text).split('\n')) {
    if (para === '') { out.push(''); continue; }
    let line = '';
    for (const word of para.split(' ')) {
      const cand = line === '' ? word : line + ' ' + word;
      if (textWidth(cand, bold, size) <= maxW) { line = cand; continue; }
      if (line !== '') { out.push(line); line = ''; }
      if (textWidth(word, bold, size) <= maxW) { line = word; continue; }
      let piece = '';
      for (const ch of word) { if (piece !== '' && textWidth(piece + ch, bold, size) > maxW) { out.push(piece); piece = ch; } else piece += ch; }
      line = piece;
    }
    out.push(line);
  }
  return out;
}

const PAGE_W = 612, PAGE_H = 792, MX = 56, TOP = 56, BOT = 64, CW = PAGE_W - 2 * MX, GAP = 16;
const KIND = {
  title: { size: 13, bold: true, lh: 16, after: 4 },
  meta: { size: 9.5, lh: 12.5, after: 5, gray: 0.27 },
  sub: { size: 9.5, lh: 12.5, after: 4, gray: 0.27 },
  body: { size: 11, lh: 15, after: 5 },
  option: { size: 11, lh: 15, after: 2, indent: 24 },
  answer: { size: 11, lh: 15, after: 3 }
};

// Lines of one question (or stimulus / test) block. The same lines feed the text route, the image route and the screen preview.
function blockLines(q, num, ctx) {
  const L = [];
  L.push({ k: 'title', text: 'Question ' + num });
  const meta = ['Difficulty: ' + cap(q.difficulty)];
  if (q.course) meta.push('Course: ' + q.course);
  if (q.unit) meta.push('Unit: ' + q.unit);
  meta.push('Topics: ' + (q.tags.length ? q.tags.join(', ') : 'None'));
  if (q.status === 'review') meta.push('Status: needs review');
  L.push({ k: 'meta', text: meta.join('   ') });
  const rich = !!(ctx && ctx.rich);   // rich = screen preview: show real tables and images; otherwise one-line placeholders
  if (q.stimulusId) {
    const s = ctx && ctx.stim && ctx.stim.get(q.stimulusId);
    L.push({ k: 'sub', text: 'Shared stimulus: ' + (s ? (s.title || 'Untitled') : '(not in this bank)') });
    if (rich && s) {
      if (s.text) L.push({ k: 'stim', text: s.text });
      if (s.table) L.push({ k: 'table', table: s.table });
      if (s.imageIds.length) L.push({ k: 'imgs', ids: s.imageIds });
    }
  }
  L.push({ k: 'body', text: q.prompt });
  if (rich) {
    if (q.table) L.push({ k: 'table', table: q.table });
    if (q.imageIds.length) L.push({ k: 'imgs', ids: q.imageIds });
  }
  const a = q.answer;
  if (q.type === 'mc') {
    a.options.forEach((o, i) => L.push({ k: 'option', label: letter(i) + '.', text: o }));
    L.push({ k: 'answer', label: 'Answer:', text: letter(a.correct) });
  } else if (q.type === 'tf') {
    L.push({ k: 'answer', label: 'Answer:', text: a.correct ? 'True' : 'False' });
  } else if (q.type === 'numeric') {
    L.push({ k: 'answer', label: 'Answer:', text: a.value + (a.units ? ' ' + a.units : '') + (a.tolerance ? '   (tolerance \u00B1' + a.tolerance + ')' : '') });
  } else if (q.type === 'short') {
    L.push({ k: 'answer', label: 'Answer lines:', text: String(a.lines) });
    if (a.rubric) L.push({ k: 'answer', label: 'Marking guide:', text: a.rubric });
  } else if (q.type === 'matching') {
    L.push({ k: 'answer', label: 'Matching pairs:', text: '' });
    a.pairs.forEach((p, i) => L.push({ k: 'option', label: (i + 1) + '.', text: p.left + '   =   ' + p.right }));
  }
  if (!rich && q.table) L.push({ k: 'sub', text: '[Table: ' + (q.table.caption || 'untitled') + ', ' + q.table.headers.length + ' columns x ' + q.table.rows.length + ' rows. Open the data in Prime Questions to see it.]' });
  if (!rich && q.imageIds.length) L.push({ k: 'sub', text: '[' + q.imageIds.length + ' image' + (q.imageIds.length > 1 ? 's' : '') + ' attached. Open the data in Prime Questions to see ' + (q.imageIds.length > 1 ? 'them' : 'it') + '.]' });
  if (q.notes) L.push({ k: 'sub', text: 'Notes: ' + q.notes });
  return L;
}

function stimulusLines(s, rich) {
  const L = [{ k: 'title', text: s.title || 'Untitled stimulus' }, { k: 'body', text: s.text }];
  if (rich) {
    if (s.table) L.push({ k: 'table', table: s.table });
    if (s.imageIds.length) L.push({ k: 'imgs', ids: s.imageIds });
    return L;
  }
  if (s.table) L.push({ k: 'sub', text: '[Table: ' + (s.table.caption || 'untitled') + ', ' + s.table.headers.length + ' columns x ' + s.table.rows.length + ' rows.]' });
  if (s.imageIds.length) L.push({ k: 'sub', text: '[' + s.imageIds.length + ' image(s) attached.]' });
  return L;
}
function testLines(t) {
  return [{ k: 'title', text: t.title || 'Untitled test' },
    { k: 'meta', text: (t.course ? 'Course: ' + t.course + '   ' : '') + t.questionIds.length + ' question' + (t.questionIds.length === 1 ? '' : 's') }];
}

function layoutText(lines, width) {
  const rows = [];
  let top = 0;
  lines.forEach((l, idx) => {
    const k = KIND[l.k] || KIND.body;
    const bold = !!k.bold;
    let indent = 0;
    const label = l.label ? safe(l.label) : null;
    if (label) indent = Math.max(k.indent || 0, textWidth(label, true, k.size) + 4);
    if (l.k === 'title' && idx > 0) top += 6;
    const ls = wrapText(l.text || '', bold, k.size, width - indent);
    ls.forEach((t, i) => {
      rows.push({ top, lh: k.lh, size: k.size, bold, gray: k.gray || 0, x: indent, text: t, label: i === 0 ? label : null });
      top += k.lh;
    });
    top += k.after;
  });
  return { kind: 'text', rows, height: top };
}

const pdfNum = n => String(Math.round(n * 100) / 100);
class Doc {
  constructor() { this.pages = []; this.newPage(); }
  newPage() { this.page = { ops: [], images: [] }; this.pages.push(this.page); this.y = PAGE_H - TOP; return this.page; }
  room() { return this.y - BOT; }
  text(x, y, str, size, bold, gray) {
    this.page.ops.push('BT /' + (bold ? 'F2' : 'F1') + ' ' + pdfNum(size) + ' Tf ' + pdfNum(gray || 0) + ' g ' + pdfNum(x) + ' ' + pdfNum(y) + ' Td ' + pstrBytes(str) + ' Tj ET');
  }
  rect(x, y, w, h, gray) { this.page.ops.push(pdfNum(gray) + ' g ' + pdfNum(x) + ' ' + pdfNum(y) + ' ' + pdfNum(w) + ' ' + pdfNum(h) + ' re f 0 g'); }
  drawRow(r, yTop) {
    const base = yTop - r.top - r.size - (r.lh - r.size) / 2;
    if (r.label) this.text(MX, base, r.label, r.size, true, r.gray);
    if (r.text !== '') this.text(MX + r.x, base, r.text, r.size, r.bold, r.gray);
  }
  place(block) {
    const usable = PAGE_H - TOP - BOT;
    if (block.kind === 'image') {
      let w = block.drawW, h = block.drawH;
      if (h > usable) { const f = usable / h; w *= f; h = usable; }
      if (h > this.room()) this.newPage();
      this.page.images.push(block);
      this.page.ops.push('q ' + pdfNum(w) + ' 0 0 ' + pdfNum(h) + ' ' + pdfNum(MX) + ' ' + pdfNum(this.y - h) + ' cm /Im' + (this.page.images.length - 1) + ' Do Q');
      this.y -= h + GAP;
    } else if (block.height <= usable) {
      if (block.height > this.room()) this.newPage();
      block.rows.forEach(r => this.drawRow(r, this.y));
      this.y -= block.height + GAP;
    } else {   // longer than a whole page: unavoidable split between rows
      let offset = 0;
      for (const r of block.rows) {
        if (this.y - (r.top - offset) - r.lh < BOT) { this.newPage(); offset = r.top; }
        this.drawRow({ ...r, top: r.top - offset }, this.y);
      }
      const last = block.rows[block.rows.length - 1];
      this.y -= (last.top - offset) + last.lh + GAP;
    }
  }
}

// Build the whole bank PDF. opts.renderBlockImage(lines, widthPt) -> {jpeg, w, h}; absent or failing => text fallback.
async function buildBankPdf(payload, opts) {
  opts = opts || {};
  const render = opts.renderBlockImage || null;
  const progress = opts.onProgress || (() => {});
  const report = { textBlocks: 0, imageBlocks: 0, fallbacks: 0, pages: 0 };
  const stim = new Map(payload.stimuli.map(s => [s.id, s]));
  const doc = new Doc();

  const makeBlock = async lines => {
    const wantsImage = lines.some(l => needsImage(l.text || '') || needsImage(l.label || ''));
    if (wantsImage && render) {
      try {
        const im = await render(lines, CW);
        report.imageBlocks++;
        return { kind: 'image', jpeg: im.jpeg, w: im.w, h: im.h, drawW: CW, drawH: CW * im.h / im.w };
      } catch (e) { report.fallbacks++; }
    }
    report.textBlocks++;
    return layoutText(lines, CW);
  };

  const byType = {};
  for (const t of TYPES) byType[t] = payload.questions.filter(q => q.type === t);
  const sections = TYPES.filter(t => byType[t].length);
  const dateStr = payload.exportedAt.slice(0, 10);

  // --- cover page ---
  const nQ = payload.questions.length;
  doc.rect(0, PAGE_H - 14, PAGE_W, 14, 0.1);
  doc.text(MX, PAGE_H - 70, 'PRIME QUESTIONS  \u00B7  QUESTION BANK FILE', 9, true, 0.3);
  doc.text(MX, PAGE_H - 110, 'Question Bank', 28, true, 0);
  doc.text(MX, PAGE_H - 134, nQ + ' Question' + (nQ === 1 ? '' : 's'), 12, true, 0);
  const extras = [];
  if (payload.stimuli.length) extras.push(payload.stimuli.length + ' shared stimul' + (payload.stimuli.length === 1 ? 'us' : 'i'));
  if (payload.tests.length) extras.push(payload.tests.length + ' saved test' + (payload.tests.length === 1 ? '' : 's'));
  if (extras.length) doc.text(MX, PAGE_H - 150, extras.join('   '), 10, false, 0.3);
  const boxTop = PAGE_H - 175;
  const boxLines = wrapText('It holds the whole question bank, answers included. Import works only from this original file: printing it, scanning it, or saving it again as a PDF removes the data Prime Questions reads. This is a teacher copy. Keep it private, because it contains the answers.', false, 10, CW - 36);
  const boxH = 30 + boxLines.length * 13 + 12;
  doc.rect(MX, boxTop - boxH, CW, boxH, 0.93);
  doc.rect(MX, boxTop - boxH, 4, boxH, 0.1);
  doc.text(MX + 18, boxTop - 22, 'A digital file for importing into Prime Questions', 11, true, 0);
  boxLines.forEach((l, i) => doc.text(MX + 18, boxTop - 40 - i * 13, l, 10, false, 0));
  let cy = boxTop - boxH - 44;
  doc.text(MX, cy, 'Question Types', 16, true, 0);
  doc.text(MX, cy - 15, 'Each type starts on its own page.', 9, false, 0.3);
  cy -= 40;
  const indexRows = sections.map(t => [TYPE_LABEL[t], byType[t].length]);
  if (payload.stimuli.length) indexRows.push(['Shared Stimuli', payload.stimuli.length]);
  if (payload.tests.length) indexRows.push(['Saved Tests', payload.tests.length]);
  for (const [label, n] of indexRows) {
    const ns = String(n), nw = textWidth(ns, true, 12), lw = textWidth(label, true, 12);
    doc.text(MX, cy, label, 12, true, 0);
    doc.text(PAGE_W - MX - nw, cy, ns, 12, true, 0);
    const dots = Math.max(0, Math.floor((CW - lw - nw - 16) / textWidth('.', false, 9)));
    doc.text(MX + lw + 8, cy, '.'.repeat(dots), 9, false, 0.5);
    cy -= 24;
  }
  doc.text(MX, 90, 'Exported ' + dateStr + '  \u00B7  Prime Questions ' + payload.appVersion + '  \u00B7  data format ' + payload.schemaVersion, 9, false, 0.3);

  // --- sections ---
  let done = 0;
  const total = nQ + payload.stimuli.length + payload.tests.length;
  const heading = (title, n) => {
    doc.newPage();
    doc.rect(MX, doc.y - 34, 5, 38, 0.1);
    doc.text(MX + 16, doc.y - 18, title, 22, true, 0);
    doc.text(MX + 16, doc.y - 32, n + ' ' + (n === 1 ? 'item' : 'items'), 9.5, false, 0.3);
    doc.y -= 62;
  };
  for (const t of sections) {
    heading(TYPE_LABEL[t], byType[t].length);
    const qs = byType[t].slice().sort((a, b) => a.created.localeCompare(b.created) || a.id.localeCompare(b.id));
    let n = 0;
    for (const q of qs) { doc.place(await makeBlock(blockLines(q, ++n, { stim }))); progress(++done, total); }
  }
  if (payload.stimuli.length) {
    heading('Shared Stimuli', payload.stimuli.length);
    for (const s of payload.stimuli) { doc.place(await makeBlock(stimulusLines(s))); progress(++done, total); }
  }
  if (payload.tests.length) {
    heading('Saved Tests', payload.tests.length);
    for (const t of payload.tests) { doc.place(await makeBlock(testLines(t))); progress(++done, total); }
  }
  report.pages = doc.pages.length;

  // --- assemble the PDF file ---
  const pdf = new Pdf();
  const catalog = pdf.reserve(), pagesId = pdf.reserve();
  const f1 = pdf.add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
  const f2 = pdf.add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
  const kids = [];
  for (let i = 0; i < doc.pages.length; i++) {
    const pg = doc.pages[i];
    const xo = pg.images.map((im, k) => '/Im' + k + ' ' + pdf.add(pdf.stream('/Type /XObject /Subtype /Image /Width ' + im.w + ' /Height ' + im.h + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode', im.jpeg)) + ' 0 R').join(' ');
    const foot = [
      'BT /F1 8 Tf 0.3 g ' + MX + ' 34 Td (Prime Questions  \u00B7  Question Bank File) Tj ET',
      'BT /F1 8 Tf 0.3 g ' + pdfNum(PAGE_W - MX - textWidth('Page ' + (i + 1) + ' of ' + doc.pages.length, false, 8)) + ' 34 Td (Page ' + (i + 1) + ' of ' + doc.pages.length + ') Tj ET'
    ];
    const content = await deflate(latin1(pg.ops.concat(foot).join('\n')));
    const cs = pdf.add(pdf.stream('/Filter /FlateDecode', content));
    kids.push(pdf.add('<< /Type /Page /Parent ' + pagesId + ' 0 R /MediaBox [0 0 ' + PAGE_W + ' ' + PAGE_H + '] /Contents ' + cs + ' 0 R /Resources << /Font << /F1 ' + f1 + ' 0 R /F2 ' + f2 + ' 0 R >>' + (xo ? ' /XObject << ' + xo + ' >>' : '') + ' >> >>'));
  }
  pdf.set(pagesId, '<< /Type /Pages /Count ' + kids.length + ' /Kids [' + kids.map(k => k + ' 0 R').join(' ') + '] >>');
  const json = enc.encode(JSON.stringify(payload));
  const ef = pdf.add(pdf.stream('/Type /EmbeddedFile /Subtype /application#2Fjson /Params << /Size ' + json.length + ' >> /Filter /FlateDecode', await deflate(json)));
  const spec = pdf.add('<< /Type /Filespec /F ' + pstr(ATTACHMENT_NAME) + ' /UF ' + pstr(ATTACHMENT_NAME) + ' /AFRelationship /Data /EF << /F ' + ef + ' 0 R >> >>');
  const d = new Date(payload.exportedAt);
  const pad = n => String(n).padStart(2, '0');
  const pdfDate = 'D:' + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + 'Z';
  const info = pdf.add('<< /Title ' + pstr('Prime Questions - Question Bank') + ' /Subject ' + pstr('Teacher question bank containing answers; format ' + payload.schemaVersion) + ' /Creator ' + pstr('Prime Questions') + ' /Producer ' + pstr('Prime Questions ' + payload.appVersion) + ' /CreationDate ' + pstr(pdfDate) + ' >>');
  pdf.set(catalog, '<< /Type /Catalog /Pages ' + pagesId + ' 0 R /Lang (en-US) /Names << /EmbeddedFiles << /Names [' + pstr(ATTACHMENT_NAME) + ' ' + spec + ' 0 R] >> >> /AF [' + spec + ' 0 R] >>');
  return { bytes: pdf.build(catalog, info), report };
}

/* === STORAGE (IndexedDB) === */
const db = (() => {
  let handle = null, opening = null;
  function open() {
    if (handle) return Promise.resolve(handle);
    if (opening) return opening;          // parallel callers share one connection (separate opens leaked connections)
    opening = new Promise((res, rej) => {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        for (const s of ['questions', 'stimuli', 'tests']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' });
        if (!d.objectStoreNames.contains('images')) d.createObjectStore('images');   // Blobs keyed by id
      };
      r.onsuccess = () => {
        const conn = r.result;
        conn.onversionchange = () => { conn.close(); if (handle === conn) handle = null; };
        handle = conn; res(conn);
      };
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('Storage is blocked by another open copy of Prime Questions. Close the other tab and reload.'));
    });
    const clear = () => { opening = null; };
    opening.then(clear, clear);
    return opening;
  }
  const req = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const finish = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error || new Error('Storage write was cancelled')); });
  return {
    async getAll(store) { const d = await open(); return req(d.transaction(store).objectStore(store).getAll()); },
    async getImages() {
      const d = await open();
      const st = d.transaction('images').objectStore('images');
      const [keys, vals] = await Promise.all([req(st.getAllKeys()), req(st.getAll())]);
      return keys.map((id, i) => ({ id, blob: vals[i] }));
    },
    async getImageIds() { const d = await open(); return req(d.transaction('images').objectStore('images').getAllKeys()); },
    async getImage(id) { const d = await open(); return req(d.transaction('images').objectStore('images').get(id)); },
    async put(store, rec) { const d = await open(); const tx = d.transaction(store, 'readwrite'); tx.objectStore(store).put(rec); return finish(tx); },
    async del(store, id) { const d = await open(); const tx = d.transaction(store, 'readwrite'); tx.objectStore(store).delete(id); return finish(tx); },
    // One transaction, so an import, a save with images, or a delete that also edits other records is all-or-nothing.
    // b = { questions, stimuli, tests: [records to put], images: [{id, blob}], deletes: { questions, stimuli, tests: [ids] } }
    async applyBatch(b) {
      const d = await open();
      const tx = d.transaction(['questions', 'stimuli', 'tests', 'images'], 'readwrite');
      for (const c of ['questions', 'stimuli', 'tests']) {
        for (const r of (b[c] || [])) tx.objectStore(c).put(r);
        for (const id of ((b.deletes && b.deletes[c]) || [])) tx.objectStore(c).delete(id);
      }
      for (const im of (b.images || [])) tx.objectStore('images').put(im.blob, im.id);
      return finish(tx);
    }
  };
})();

/* === UI helpers === */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const kid of kids.flat(Infinity)) { if (kid == null || kid === false) continue; el.append(kid instanceof Node ? kid : String(kid)); }
  return el;
}

// Math rendering: text is already in place (set with textContent); Temml renders inside it.
function renderMath(el) {

    preProcess: s => '\\displaystyle ' + s,

}

// Promise-based dialog. actions: [{label, value, kind}]; Escape resolves dismissValue.
function modal({ title, body, actions, dismissValue }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const close = v => { back.remove(); document.removeEventListener('keydown', onKey, true); if (prev && prev.focus) prev.focus(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape' && dismissValue !== undefined) { e.stopPropagation(); close(dismissValue); } };
    const btns = actions.map(a => h('button', { class: 'btn ' + (a.kind || ''), type: 'button', onclick: () => close(a.value) }, a.label));
    const back = h('div', { class: 'modal-back' },
      h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
        h('h3', null, title), body, h('div', { class: 'actions' }, btns)));
    document.body.append(back);
    document.addEventListener('keydown', onKey, true);
    // never start focus on a destructive button: Enter must not confirm a delete
    const safeIdx = actions.some(a => a.kind === 'danger') ? 0 : btns.length - 1;
    (btns[safeIdx] || back).focus();
  });
}
const info = (title, ...paras) => modal({ title, body: h('div', null, paras.flat().map(p => h('p', null, p))), actions: [{ label: 'OK', value: true, kind: 'primary' }], dismissValue: true });

function progressModal(title) {
  const bar = h('div', null), label = h('p', { class: 'hint' }, 'Starting…');
  const back = h('div', { class: 'modal-back' }, h('div', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
    h('h3', null, title), label, h('div', { class: 'progress-bar' }, bar)));

}

function blockCss(u, sel) {
  const p = n => (n * u).toFixed(2) + 'px';
  return sel + '{font-family:Helvetica,Arial,"Liberation Sans",sans-serif;color:#000;font-size:' + p(11) + ';line-height:' + p(15) + ';}' +
    sel + ' .pb-row{margin:0 0 ' + p(4) + ';white-space:pre-wrap;overflow-wrap:anywhere;}' +
    sel + ' .pb-title{font-weight:700;font-size:' + p(13) + ';line-height:' + p(16) + ';margin-top:' + p(6) + ';}' +
    sel + ' .pb-title:first-child{margin-top:0;}' +
    sel + ' .pb-meta,' + sel + ' .pb-sub{font-size:' + p(9.5) + ';line-height:' + p(12.5) + ';color:#444;}' +
    sel + ' .pb-hang{display:flex;}' +
    sel + ' .pb-label{flex:none;font-weight:700;padding-right:' + p(4) + ';}' +
    sel + ' .pb-option .pb-label{min-width:' + p(24) + ';}' +
    sel + ' .pb-text{flex:1;min-width:0;}' +
    sel + ' .pb-stim{border-left:' + p(2) + ' solid #000;padding-left:' + p(8) + ';}' +
    sel + ' .pq-table{border-collapse:collapse;margin:' + p(2) + ' 0;}' +
    sel + ' .pq-table th,' + sel + ' .pq-table td{border:1px solid #000;padding:' + p(2) + ' ' + p(6) + ';text-align:left;}' +
    sel + ' .pq-cap{font-weight:700;padding-bottom:' + p(2) + ';}' +
    sel + ' .pq-imgs img{max-width:100%;max-height:' + p(180) + ';margin:' + p(2) + ' ' + p(6) + ' 0 0;}';
}
function buildBlockDom(lines) {
  const root = h('div', { class: 'pb' });
  for (const l of lines) {
    if (l.k === 'table') { root.append(h('div', { class: 'pb-row pb-tablerow' }, buildTableDom(l.table))); continue; }
    if (l.k === 'imgs') { root.append(h('div', { class: 'pb-row pb-imgsrow' }, buildImgsDom(l.ids))); continue; }
    const row = h('div', { class: 'pb-row pb-' + l.k + (l.label ? ' pb-hang' : '') });

    row.append(h('span', { class: 'pb-text' }, l.text || ''));
    root.append(row);
  }
  return root;
}
function temmlCss() {
  const css = document.getElementById('app-css').textContent;
  const a = css.indexOf('/* === VENDOR START: temml CSS'), b = css.indexOf('/* === VENDOR END: temml CSS === */');
  if (a < 0 || b < 0) throw new Error('Temml CSS block not found');
  return css.slice(a, b);

// Image route: lines -> DOM (+ Temml) -> SVG foreignObject -> canvas -> JPEG. Throws if the browser cannot do it.
async function renderBlockImage(lines, widthPt) {
  const SCALE = 3;
  const W = Math.round(widthPt * SCALE);
  const styleEl = h('style', null, blockCss(SCALE, '.pbimg .pb'));
  // host is parked off-screen; only `inner` is serialized, so the off-screen position is not drawn
  const inner = h('div', { class: 'pbimg', style: 'width:' + W + 'px;background:#fff;' }, buildBlockDom(lines));
  const wrap = h('div', { style: 'position:fixed;left:-100000px;top:0;' }, inner);
  document.head.append(styleEl);
  document.body.append(wrap);
  try {
    renderMath(inner);
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const H = Math.ceil(inner.getBoundingClientRect().height) + 4;
    const xml = new XMLSerializer().serializeToString(inner);
    // CSS goes in CDATA: raw "&" and "<" in it make the SVG fail to load
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="' + W + '" height="' + H + '"><style>/*<![CDATA[*/' + temmlCss() + blockCss(SCALE, '.pbimg .pb') + '/*]]>*/</style><foreignObject x="0" y="0" width="' + W + '" height="' + H + '">' + xml + '</foreignObject></svg>';
    const img = new Image();
    await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error('svg image failed to load')); img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, W, H);
    g.drawImage(img, 0, 0);
    const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
    if (!blob) throw new Error('canvas could not produce an image');
    return { jpeg: new Uint8Array(await blob.arrayBuffer()), w: W, h: H };
  } finally { wrap.remove(); styleEl.remove(); }
}

/* === IMAGES and TABLES: shared by the editors, the previews and printing === */
const MAX_IMAGE_EDGE = 1600, MAX_IMAGE_BYTES = 25 * 1024 * 1024, MAX_SVG_BYTES = 2 * 1024 * 1024;
const MAX_IMAGES = 6, MAX_COLS = 8, MAX_ROWS = 40;
const imgUrls = new Map();     // image id -> object URL, for this page load

// Make sure the object URLs for these ids exist. `pending` holds images added in the open editor and not saved yet.
async function ensureImageUrls(ids, pending) {
  for (const id of ids) {
    if (imgUrls.has(id)) continue;
    let blob = pending && pending.get(id);
    if (!blob) { try { blob = await db.getImage(id); } catch (e) { blob = null; } }
    if (blob) imgUrls.set(id, URL.createObjectURL(blob));
  }
}

// PNG and JPEG are kept as they are unless the long edge is over ~1600 px (then re-drawn smaller). SVG is kept as is
// and is only ever shown through <img>, so any script inside it never runs.
async function processImageFile(file) {
  if (file.size > MAX_IMAGE_BYTES) throw new Error('That file is bigger than 25 MB.');
  const head = new Uint8Array(await file.slice(0, 4).arrayBuffer());
  const png = head[0] === 0x89 && head[1] === 0x50 && head[2] === 0x4E && head[3] === 0x47;
  const jpg = head[0] === 0xFF && head[1] === 0xD8 && head[2] === 0xFF;
  if (!png && !jpg) {
    if (file.size > MAX_SVG_BYTES) throw new Error('Use a PNG, JPEG or SVG image (an SVG can be up to 2 MB).');
    const text = await file.text();
    const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
    if (doc.getElementsByTagName('parsererror').length || doc.documentElement.nodeName !== 'svg') throw new Error('Use a PNG, JPEG or SVG image.');
    return new Blob([text], { type: 'image/svg+xml' });
  }
  let bmp;
  try { bmp = await createImageBitmap(file); } catch (e) { throw new Error('That image could not be read.'); }
  const type = png ? 'image/png' : 'image/jpeg';
  const long = Math.max(bmp.width, bmp.height);
  if (long <= MAX_IMAGE_EDGE) { if (bmp.close) bmp.close(); return new Blob([file], { type }); }
  const f = MAX_IMAGE_EDGE / long;
  const c = document.createElement('canvas');
  c.width = Math.round(bmp.width * f); c.height = Math.round(bmp.height * f);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  if (bmp.close) bmp.close();
  const blob = await new Promise(res => c.toBlob(res, type, 0.9));
  if (!blob) throw new Error('That image could not be resized.');
  return blob;
}

// The caption is a line above the table (an HTML <caption> is only as wide as the table and wraps badly);

}

];

function insideMath(v, pos) { const before = v.slice(0, pos); return before.lastIndexOf('\\(') > before.lastIndexOf('\\)'); }

function insertSnippet(btn) {
  const f = lastField;
  if (!f || !f.isConnected) { toast('Click into a text box first, then use the insert buttons.', 'warn'); return; }
  const v = f.value, s = f.selectionStart, e = f.selectionEnd, sel = v.slice(s, e);
  const inside = insideMath(v, s);
  let text, caret;
  if (btn.plain) { text = btn.plain; caret = text.length; }
  else if (btn.kind === 'delims') {
    if (inside) { toast('Already inside math.', 'warn'); return; }
    text = '\\(' + sel + '\\)'; caret = sel ? text.length : 2;
  } else {
    let tpl = sel ? btn.withSel : btn.noSel;
    const wrap = !inside;
    if (wrap) tpl = '\\(' + tpl + '\\)';
    tpl = tpl.replace('¦', () => sel);      // function form: the selection may contain "$" patterns
    const at = tpl.indexOf('§');
    text = tpl.replace('§', '');
    caret = at >= 0 ? at : text.length;
  }
  f.value = v.slice(0, s) + text + v.slice(e);
  f.focus();
  f.setSelectionRange(s + caret, s + caret);
  f.dispatchEvent(new Event('input', { bubbles: true }));
}

async function guardDirty() {
  if (!state.editor || !state.editor.dirty) return true;
  return modal({
    title: 'Discard unsaved changes?',
    body: h('p', null, 'This ' + KIND_LABEL[state.editor.kind] + ' has changes that are not saved. If you leave now they will be lost.'),
    actions: [{ label: 'Keep editing', value: false }, { label: 'Discard changes', value: true, kind: 'danger' }],
    dismissValue: false

}

function makeEditor(kind, draft, isNew) {
  const ed = { kind, draft, original: clone(draft), isNew, dirty: false, pending: new Map(), answers: {}, lastNote: '' };
  if (kind === 'question') ed.answers[draft.type] = draft.answer;
  return ed;
}

async function newItem() {
  if (!(await guardDirty())) return;
  const t = nowIso();
  let kind, d;
  if (state.mode === 'questions') { kind = 'question'; d = emptyQuestion('mc'); }
  else if (state.mode === 'stimuli') { kind = 'stimulus'; d = { id: uuid(), title: '', text: '', imageIds: [], table: null, created: t, updated: t }; }
  else { kind = 'test'; d = { id: uuid(), title: '', course: '', questionIds: [], seed: newSeed(), created: t, updated: t }; }
  state.selectedId = null; lastField = null;
  state.editor = makeEditor(kind, d, true);
  renderPanel(); renderEditor();
}
async function openRecord(kind, id) {
  if (state.editor && state.editor.draft.id === id) return;
  if (!(await guardDirty())) return;
  const rec = (kind === 'question' ? state.questions : kind === 'stimulus' ? state.stimuli : state.tests).find(x => x.id === id);
  if (!rec) return;
  state.selectedId = id; lastField = null;
  state.editor = makeEditor(kind, clone(rec), false);
  renderPanel(); renderEditor();
}
async function closeEditor() {
  if (!(await guardDirty())) return;

// "Does this question have problems?" is slow (it renders every maths snippet), so remember it per saved version of a question.
const problemCache = new Map();

}

function touchTest() {
  const ed = state.editor, d = ed.draft;
  ed.dirty = stable(d) !== stable(ed.original);
  el.dirtyFlag.textContent = ed.dirty ? '● Unsaved changes' : '';
  el.saveBtn.disabled = !ed.dirty || !d.title.trim();
  const qById = new Map(state.questions.map(q => [q.id, q]));
  const present = d.questionIds.map(id => qById.get(id)).filter(Boolean);
  const missing = d.questionIds.length - present.length;
  const review = present.filter(q => q.status === 'review').length;
  const bad = present.filter(hasProblems).length;
  const hinty = present.filter(q => q.type === 'mc' && !q.keepOrder && q.answer.options.some(o => /\b(all|none)\s+of\s+the\s+above\b/i.test(o)));
  const items = [];
  if (!d.title.trim()) items.push(['warn', 'Give the test a title to save it.']);
