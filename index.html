  if (missing) items.push(['warn', plural(missing, 'question') + ' in this test ' + (missing === 1 ? 'is' : 'are') + ' no longer in the bank and will be skipped.']);
  if (review) items.push(['warn', plural(review, 'question') + ' ' + (review === 1 ? 'is' : 'are') + ' marked “Needs review”.']);
  if (bad) items.push(['warn', plural(bad, 'question') + ' ' + (bad === 1 ? 'has' : 'have') + ' problems (missing answers or broken maths). Open them in the Questions tab.']);
  for (const q of hinty) items.push(['warn', 'Version B will shuffle the options of “' + snippet(q.prompt).slice(0, 50) + '”, which has an “all/none of the above” option. Open it and tick “Keep these options in this order”.']);
  el.testWarn.textContent = '';
  el.testWarn.append(items.length ? h('ul', { class: 'problems' }, items.map(([, m]) => h('li', null, m))) : h('p', { class: 'ok-line' }, h('b', null, '✓ '), 'Ready to print: ' + plural(present.length, 'question') + '.'));
  for (const b of el.printBtns) b.disabled = !present.length;

/* === SAVE and DELETE === */
async function saveCurrent() {
  const ed = state.editor;
  if (!ed || !ed.dirty) return;
  const d = clone(ed.draft);
  const batch = {};
  let coll, list;
  if (ed.kind === 'question') {
    normalizeQuestion(d);
    const problems = checkQuestion(d);
    if (d.status === 'ready' && problems.length) { toast('Fix the problems first, or set the status to “Needs review”.', 'err'); return; }
    coll = 'questions'; list = state.questions;
  } else if (ed.kind === 'stimulus') {
    d.title = d.title.trim(); d.text = d.text.trim(); normalizeTable(d);
    if (!d.title) { toast('Give the stimulus a title first.', 'err'); return; }
    coll = 'stimuli'; list = state.stimuli;
  } else {
    d.title = d.title.trim(); d.course = d.course.trim();
    if (!d.title) { toast('Give the test a title first.', 'err'); return; }
    coll = 'tests'; list = state.tests;
  }
  d.updated = nowIso();
  batch[coll] = [d];
  const newImages = (d.imageIds || []).filter(id => ed.pending.has(id)).map(id => ({ id, blob: ed.pending.get(id) }));
  if (newImages.length) batch.images = newImages;
  try {
    await ensurePersist();
    await db.applyBatch(batch);
  } catch (e) { toast('Could not save: ' + (e && e.message || e) + ' Your edits are still on screen. Export what you have, then try again.', 'err'); return; }
  const i = list.findIndex(x => x.id === d.id);
  if (i >= 0) list[i] = d; else list.push(d);
  for (const im of newImages) { state.imageIds.add(im.id); ed.pending.delete(im.id); }
  state.selectedId = d.id;
  const pend = ed.pending;
  state.editor = makeEditor(ed.kind, clone(d), false);
  state.editor.pending = pend;
  if (ed.kind === 'test') { state.editor.pv = ed.pv; }
  renderPanel(); renderEditor(); renderStatus();
  toast('Saved.', 'ok');
}

async function deleteCurrent() {
  const ed = state.editor;

    title = 'Delete this question?';
    body = h('div', null, h('p', null, snippet(ed.original.prompt)),

async function collectPayload() {
  const [questions, stimuli, tests, imgs] = await Promise.all([db.getAll('questions'), db.getAll('stimuli'), db.getAll('tests'), db.getImages()]);
  const images = Object.create(null);
  for (const im of imgs.sort((a, b) => String(a.id).localeCompare(String(b.id)))) images[im.id] = await blobToDataUrl(im.blob);

async function exportBank() {
  if (exporting) return;
  exporting = true;
  const pm = progressModal('Building your bank PDF');
  try {
    pm.update(0, 0, 'Collecting questions…');
    const payload = await collectPayload();
    const { bytes, report } = await buildBankPdf(payload, { renderBlockImage, onProgress: (d, t) => pm.update(d, t, 'Drawing page content: ' + d + ' of ' + t) });

  const parsed = parsePayload(raw);
  if (!parsed.ok) { await modal({ title: 'Could not import this file', body: h('div', null, parsed.errors.map(m => h('p', null, m))), actions: [{ label: 'OK', value: true, kind: 'primary' }], dismissValue: true }); return; }

  if (planIsNoop(plan)) { await info('Nothing to import', 'Everything in this file is already in your bank, or your copies are newer. Nothing was changed.'); return; }
